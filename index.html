<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin-Op 4 Charity — Coming Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #00ff9f;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Scanlines */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 10;
    }

    #matrix {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.32;
    }

    .container {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 1.5rem 1.2rem;
      max-width: 520px;
      width: 100%;
    }

    /* Clean glowing title instead of fragile ASCII */
    .logo {
      font-size: clamp(1.7rem, 7.5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.15;
      text-shadow: 
        0 0 8px #00ff9f,
        0 0 18px #00ff9f66,
        0 0 30px #00ff9f33;
      margin-bottom: 0.3rem;
    }

    .logo span {
      display: block;
      font-size: 0.72em;
      letter-spacing: 0.18em;
      opacity: 0.95;
    }

    .status {
      display: inline-block;
      border: 1px solid #00ff9f55;
      padding: 0.55rem 1.2rem;
      border-radius: 4px;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      background: rgba(0, 255, 159, 0.05);
      margin: 1.6rem 0 2.2rem;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 255, 159, 0.25); }
      50% { box-shadow: 0 0 16px 3px rgba(0, 255, 159, 0.12); }
    }

    form {
      background: rgba(0, 18, 14, 0.7);
      border: 1px solid #00ff9f33;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.78rem;
      margin-bottom: 0.3rem;
      color: #7dffc8;
      letter-spacing: 0.05em;
    }

    input, textarea {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #00ff9f44;
      color: #00ff9f;
      padding: 0.7rem 0.85rem;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 1.05rem;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #00ff9f;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      background: #00ff9f;
      color: #050505;
      border: none;
      padding: 0.85rem;
      font-family: inherit;
      font-weight: bold;
      font-size: 1rem;
      letter-spacing: 0.08em;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    .footer {
      margin-top: 1.8rem;
      font-size: 0.72rem;
      color: #00ff9f77;
      letter-spacing: 0.04em;
    }

    .heart {
      color: #ff4d8d;
      text-shadow: 0 0 8px #ff4d8d;
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <div class="container">
    <div class="logo">
      COIN-OP<br>
      <span>4 CHARITY</span>
    </div>

    <div class="status">
      SYSTEM ONLINE // FULL SITE COMING SOON
    </div>

    <!-- 
      FORM SETUP:
      1. Go to https://formspree.io (free)
      2. Create a form → set email to samazar213@gmail.com
      3. Paste the form endpoint below
    -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="inquiry">Inquiry</label>
      <textarea id="inquiry" name="inquiry" required></textarea>

      <input type="hidden" name="_subject" value="New inquiry from Coin-Op 4 Charity">

      <button type="submit">SEND MESSAGE</button>
    </form>

    <div class="footer">
      coinop4charity.org &nbsp;•&nbsp; We love you all. <span class="heart">♥</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン$█▓▒░";
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function draw() {
      ctx.fillStyle = "rgba(5, 5, 5, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00ff9f";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 40);

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>

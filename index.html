        ctx.fillStyle = `rgba(200, 255, 230, ${0.3 + s.s * 0.15})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
        ctx.fill();
      });

      // ski trail
      yeti.trail.forEach(t => {
        ctx.globalAlpha = t.life / 30;
        ctx.fillStyle = '#00ff9f33';
        ctx.fillRect(t.x - 10, t.y, 20, 3);
      });
      ctx.globalAlpha = 1;

      // trees (layered neon pines)
      yeti.trees.forEach(t => {
        const lean = t.lean || 0;
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(lean);
        // trunk
        ctx.fillStyle = '#003318';
        ctx.fillRect(-3, 0, 6, t.h * 0.45);
        // layered foliage
        const layers = 3;
        for (let i = 0; i < layers; i++) {
          const yy = -t.h * 0.55 + i * (t.h * 0.28);
          const ww = t.h * 0.55 - i * 6;
          ctx.fillStyle = i === 0 ? '#00ff9f' : (i === 1 ? '#00cc7a' : '#00995a');
          ctx.beginPath();
          ctx.moveTo(0, yy - 8);
          ctx.lineTo(-ww, yy + t.h * 0.32);
          ctx.lineTo(ww, yy + t.h * 0.32);
          ctx.closePath();
          ctx.fill();
        }
        // snow cap
        ctx.fillStyle = '#e8fff5';
        ctx.beginPath();
        ctx.moveTo(0, -t.h * 0.55 - 8);
        ctx.lineTo(-8, -t.h * 0.4);
        ctx.lineTo(8, -t.h * 0.4);
        ctx.fill();
        ctx.restore();
      });

      // skier (goofy panicked)
      const sk = yeti.skier;
      ctx.save();
      ctx.translate(sk.x, sk.y);
      const leanX = (keys['ArrowLeft'] || keys['a'] || touchState.left) ? -0.2 :
                    (keys['ArrowRight'] || keys['d'] || touchState.right) ? 0.2 : 0;
      ctx.rotate(leanX);
      // skis (wonky)
      ctx.fillStyle = '#7dffc8';
      ctx.shadowColor = '#00ff9f';
      ctx.shadowBlur = 8;
      ctx.fillRect(-24, 15, 20, 5);
      ctx.fillRect(2, 14, 22, 5);
      // body - slightly hunched
      ctx.fillStyle = '#00ff9f';
      ctx.fillRect(-9, -8, 18, 22);
      // flailing arms
      const armWiggle = Math.sin(yeti.frame * 0.4) * 6;
      ctx.fillRect(-16, -2 + armWiggle * 0.3, 8, 14);
      ctx.fillRect(8, -2 - armWiggle * 0.3, 8, 14);
      // big goofy head
      ctx.beginPath();
      ctx.arc(0, -18, 11, 0, Math.PI * 2);
      ctx.fill();
      // huge panicked eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-4, -20, 4.5, 0, Math.PI * 2);
      ctx.arc(5, -19, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-3, -19, 2, 0, Math.PI * 2);
      ctx.arc(6, -18, 2.2, 0, Math.PI * 2);
      ctx.fill();
      // open scream mouth
      ctx.fillStyle = '#003322';
      ctx.beginPath();
      ctx.ellipse(0, -12, 4, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // little beanie
      ctx.fillStyle = '#00cc7a';
      ctx.fillRect(-8, -28, 16, 6);
      ctx.beginPath();
      ctx.arc(0, -28, 8, Math.PI, 0);
      ctx.fill();
      // pom pom
      ctx.beginPath();
      ctx.arc(0, -34, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();

      // warning banner
      if (yeti.warning > 0) {
        ctx.fillStyle = `rgba(255, 180, 50, ${0.3 + Math.sin(yeti.frame * 0.35) * 0.2})`;
        ctx.fillRect(0, 0, 480, 52);
        ctx.fillStyle = '#ffcc44';
        ctx.font = 'bold 17px Courier New';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ffaa00';
        ctx.shadowBlur = 10;
        ctx.fillText('⚠ HUNGRY YETI INCOMING ⚠', 240, 34);
        ctx.shadowBlur = 0;
      }

      // yeti — funny, desperate, sick-looking fluffy goof
      if (yeti.yetiActive) {
        const yx = yeti.yeti.x, yy = yeti.yeti.y;
        const pant = Math.sin(yeti.frame * 0.25) * 2;
        ctx.save();
        ctx.translate(yx, yy);
        ctx.shadowColor = '#aaddff';
        ctx.shadowBlur = 14;

        // shaggy white/gray body
        ctx.fillStyle = '#d8e8f0';
        ctx.beginPath();
        ctx.ellipse(0, 10 + pant * 0.3, 30, 28, 0, 0, Math.PI * 2);
        ctx.fill();
        // belly
        ctx.fillStyle = '#eef6fa';
        ctx.beginPath();
        ctx.ellipse(0, 14, 18, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        // head (big & soft)
        ctx.fillStyle = '#d8e8f0';
        ctx.beginPath();
        ctx.ellipse(0, -24 + pant, 22, 20, 0, 0, Math.PI * 2);
        ctx.fill();

        // floppy arms reaching
        ctx.fillStyle = '#c8d8e0';
        ctx.beginPath();
        ctx.ellipse(-32, 0 + pant, 12, 22, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(32, 0 - pant, 12, 22, 0.4, 0, Math.PI * 2);
        ctx.fill();

        // desperate googly eyes (uneven)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-9, -26 + pant, 7, 0, Math.PI * 2);
        ctx.arc(10, -25 + pant, 8, 0, Math.PI * 2);
        ctx.fill();
        // pupils looking slightly different directions (crazy)
        ctx.fillStyle = '#223';
        ctx.beginPath();
        ctx.arc(-7, -24 + pant, 3, 0, Math.PI * 2);
        ctx.arc(12, -27 + pant, 3.5, 0, Math.PI * 2);
        ctx.fill();
        // tired bags under eyes
        ctx.strokeStyle = '#99aab5';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(-9, -20 + pant, 5, 0.2, Math.PI - 0.2);
        ctx.stroke();

        // open panting mouth + tongue
        ctx.fillStyle = '#4a3030';
        ctx.beginPath();
        ctx.ellipse(0, -14 + pant, 8, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        // tongue hanging out
        ctx.fillStyle = '#ff6b8a';
        ctx.beginPath();
        ctx.ellipse(3, -10 + pant, 4, 5, 0.3, 0, Math.PI * 2);
        ctx.fill();

        // messy hair tufts (not horns)
        ctx.fillStyle = '#b0c4d0';
        ctx.beginPath();
        ctx.ellipse(-12, -40 + pant, 6, 8, -0.3, 0, Math.PI * 2);
        ctx.ellipse(0, -44 + pant, 7, 9, 0, 0, Math.PI * 2);
        ctx.ellipse(12, -40 + pant, 6, 8, 0.3, 0, Math.PI * 2);
        ctx.fill();

        // sweat / desperation drops
        ctx.fillStyle = '#7ec8e3';
        ctx.beginPath();
        ctx.ellipse(-20, -30 + pant, 2, 3, 0, 0, Math.PI * 2);
        ctx.ellipse(22, -28 + pant, 2.5, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.restore();
      }

      // HI score
      const hs = getHigh('yeti');
      if (hs > 0) {
        ctx.fillStyle = '#7dffc8';
        ctx.font = '11px Courier New';
        ctx.textAlign = 'left';
        ctx.fillText(`HI ${hs}`, 12, 22);
      }
    }

    // ========== 8. SPACE ROCK SWARM ==========
    let rocks = {};
    function initRocks() {
      rocks = { score:0, lives:3, ship:{x:240,y:180,angle:0,vx:0,vy:0}, bullets:[], asteroids:[], lastShot:0, invuln:0 };
      for (let i=0;i<5;i++) spawnAsteroid(3);
      updateUI(0,3); loopRocks();
    }
    function spawnAsteroid(size, x, y) {
      const speed = 0.6 + Math.random()*1.4;
      const angle = Math.random()*Math.PI*2;
      rocks.asteroids.push({
        x: x!==undefined?x:Math.random()*480, y: y!==undefined?y:Math.random()*360,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, size, r: size*14
      });
    }
    function loopRocks() {
      if (currentGame !== 'rocks') return;
      const r = rocks;
      const left = keys['ArrowLeft']||keys['a']||keys['A']||touchState.left;
      const right = keys['ArrowRight']||keys['d']||keys['D']||touchState.right;
      const thrust = keys['ArrowUp']||keys['w']||keys['W']||touchState.up;
      const fire = keys[' ']||touchState.fire;
      if (left) r.ship.angle -= 0.085; if (right) r.ship.angle += 0.085;
      if (thrust) { r.ship.vx += Math.cos(r.ship.angle)*0.18; r.ship.vy += Math.sin(r.ship.angle)*0.18; }
      r.ship.vx *= 0.985; r.ship.vy *= 0.985;
      r.ship.x += r.ship.vx; r.ship.y += r.ship.vy;
      if (r.ship.x < 0) r.ship.x = 480; if (r.ship.x > 480) r.ship.x = 0;
      if (r.ship.y < 0) r.ship.y = 360; if (r.ship.y > 360) r.ship.y = 0;
      if (fire && Date.now()-r.lastShot > 200) {
        r.bullets.push({
          x: r.ship.x + Math.cos(r.ship.angle)*14, y: r.ship.y + Math.sin(r.ship.angle)*14,
          vx: Math.cos(r.ship.angle)*7.5 + r.ship.vx, vy: Math.sin(r.ship.angle)*7.5 + r.ship.vy, life:50
        });
        r.lastShot = Date.now();
        sfx('shoot');
      }
      for (let i=r.bullets.length-1;i>=0;i--) {
        const b = r.bullets[i]; b.x+=b.vx; b.y+=b.vy; b.life--;
        if (b.life<=0 || b.x<-20||b.x>500||b.y<-20||b.y>380) r.bullets.splice(i,1);
      }
      r.asteroids.forEach(a => {
        a.x+=a.vx; a.y+=a.vy;
        if (a.x < -a.r) a.x=480+a.r; if (a.x>480+a.r) a.x=-a.r;
        if (a.y < -a.r) a.y=360+a.r; if (a.y>360+a.r) a.y=-a.r;
      });
      for (let bi=r.bullets.length-1;bi>=0;bi--) {
        const b = r.bullets[bi];
        for (let ai=r.asteroids.length-1;ai>=0;ai--) {
          const a = r.asteroids[ai];
          const dx=b.x-a.x, dy=b.y-a.y;
          if (dx*dx+dy*dy < a.r*a.r) {
            r.bullets.splice(bi,1); r.score += (4-a.size)*20; updateUI(r.score, r.lives); sfx('explode');
            if (a.size >= 2) shake(4 + a.size);
            if (a.size > 1) { spawnAsteroid(a.size-1, a.x, a.y); spawnAsteroid(a.size-1, a.x, a.y); }
            r.asteroids.splice(ai,1); break;
          }
        }
      }
      if (r.invuln > 0) r.invuln--;
      else {
        for (const a of r.asteroids) {
          const dx=r.ship.x-a.x, dy=r.ship.y-a.y;
          if (dx*dx+dy*dy < (a.r+8)*(a.r+8)) {
            r.lives--; updateUI(r.score, r.lives);
            if (r.lives <= 0) { drawRocks(); shake(12); showGameOver('SHIP DESTROYED', 'rocks', r.score); return; }
            r.ship.x=240; r.ship.y=180; r.ship.vx=0; r.ship.vy=0; r.invuln=90; break;
          }
        }
      }
      if (r.asteroids.length === 0) for (let i=0;i<5+Math.floor(r.score/400);i++) spawnAsteroid(3);
      drawRocks(); animId = requestAnimationFrame(loopRocks);
    }
    function drawRocks() {
      ctx.fillStyle='#000'; ctx.fillRect(0,0,480,360);
      rocks.asteroids.forEach(a => {
        ctx.strokeStyle='#00ff9f'; ctx.lineWidth=2; ctx.beginPath();
        const pts = 7 + a.size;
        for (let i=0;i<pts;i++) {
          const ang = (i/pts)*Math.PI*2;
          const rad = a.r * (0.75 + Math.sin(i*2.3)*0.25);
          const px = a.x + Math.cos(ang)*rad, py = a.y + Math.sin(ang)*rad;
          if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.stroke();
      });
      ctx.fillStyle='#fff';
      rocks.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x,b.y,2.5,0,Math.PI*2); ctx.fill(); });
      if (rocks.invuln===0 || Math.floor(rocks.invuln/4)%2===0) {
        ctx.save(); ctx.translate(rocks.ship.x, rocks.ship.y); ctx.rotate(rocks.ship.angle);
        ctx.strokeStyle='#00ff9f'; ctx.lineWidth=2; ctx.shadowColor='#00ff9f'; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-10,-9); ctx.lineTo(-6,0); ctx.lineTo(-10,9); ctx.closePath(); ctx.stroke();
        ctx.shadowBlur=0; ctx.restore();
      }
    }

    // ========== 9. CIRCUIT RUNNER ==========
    let runner = {};

    function initRunner() {
      runner = {
        score: 0,
        speed: 4.2,
        maxSpeed: 13,
        player: { x: 90, y: 260, w: 28, h: 36, vy: 0, onGround: true, jumpPower: -11.5 },
        gravity: 0.55,
        obstacles: [],
        coins: [],
        particles: [],
        groundY: 300,
        frame: 0,
        distance: 0,
        gameOver: false,
        invuln: 0,
        nextObstacle: 90,
        nextCoin: 50,
        bgOffset: 0,
        buildings: [],
        dashTimer: 0,
        dashCooldown: 0,
        combo: 0,
        comboTimer: 0,
        nearMissCooldown: 0,
        scorePops: []
      };
      // seed parallax buildings
      for (let i = 0; i < 8; i++) {
        runner.buildings.push({
          x: i * 140 + Math.random() * 40,
          w: 50 + Math.random() * 70,
          h: 60 + Math.random() * 140,
          layer: Math.random() > 0.5 ? 1 : 2
        });
      }
      updateUI(0, null);
      loopRunner();
    }

    function spawnRunnerObstacle() {
      const types = ['block', 'spike', 'gap'];
      const type = types[Math.floor(Math.random() * types.length)];
      if (type === 'gap') {
        runner.obstacles.push({ type: 'gap', x: 520, w: 70 + Math.random() * 50 });
      } else if (type === 'spike') {
        runner.obstacles.push({ type: 'spike', x: 520, w: 24, h: 28 });
      } else {
        const h = 30 + Math.random() * 50;
        runner.obstacles.push({ type: 'block', x: 520, w: 30 + Math.random() * 30, h });
      }
    }

    function spawnRunnerCoin() {
      runner.coins.push({
        x: 520,
        y: 160 + Math.random() * 100,
        r: 8,
        collected: false
      });
    }

    function addParticles(x, y, count, color) {
      for (let i = 0; i < count; i++) {
        runner.particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 2,
          life: 20 + Math.random() * 15,
          color
        });
      }
    }

    function loopRunner() {
      if (currentGame !== 'runner') return;
      if (runner.gameOver) return;

      const r = runner;
      r.frame++;
      // Gentler early ramp, then accelerates — feels more progressive
      const ramp = r.distance < 800 ? 0.0012 : (r.distance < 2000 ? 0.0021 : 0.0028);
      r.speed = Math.min(r.maxSpeed, r.speed + ramp);
      r.distance += r.speed;
      r.score = Math.floor(r.distance / 6) + (r.combo > 1 ? r.combo * 2 : 0);
      r.bgOffset += r.speed * 0.3;
      if (r.frame % 6 === 0) updateUI(r.score, null);

      // input
      const jumpPressed = keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' '] || touchState.up;
      const dashPressed = keys['Shift'] || keys['f'] || keys['F'] || touchState.fire;

      if (jumpPressed && r.player.onGround) {
        r.player.vy = r.player.jumpPower;
        r.player.onGround = false;
        sfx('jump');
      }

      // dash boost
      if (dashPressed && r.dashCooldown <= 0) {
        r.dashTimer = 12;
        r.dashCooldown = 45;
        r.speed = Math.min(r.maxSpeed + 3, r.speed + 2.8);
        sfx('thrust');
        addParticles(r.player.x, r.player.y + r.player.h / 2, 8, '#00ff9f');
      }
      if (r.dashCooldown > 0) r.dashCooldown--;
      if (r.dashTimer > 0) {
        r.dashTimer--;
        r.speed = Math.min(r.maxSpeed + 2, r.speed + 0.15);
      }

      // physics
      r.player.vy += r.gravity;
      r.player.y += r.player.vy;

      if (r.player.y + r.player.h >= r.groundY) {
        r.player.y = r.groundY - r.player.h;
        r.player.vy = 0;
        if (!r.player.onGround) sfx('land');
        r.player.onGround = true;
      }

      // spawn
      r.nextObstacle--;
      if (r.nextObstacle <= 0) {
        spawnRunnerObstacle();
        r.nextObstacle = 70 + Math.random() * 80 - r.speed * 2;
      }
      r.nextCoin--;
      if (r.nextCoin <= 0) {
        spawnRunnerCoin();
        r.nextCoin = 40 + Math.random() * 50;
      }

      // combo timer decay
      if (r.comboTimer > 0) r.comboTimer--;
      else r.combo = 0;
      if (r.nearMissCooldown > 0) r.nearMissCooldown--;

      // move obstacles
      for (let i = r.obstacles.length - 1; i >= 0; i--) {
        const o = r.obstacles[i];
        o.x -= r.speed;
        if (o.x + (o.w || 40) < -20) {
          r.obstacles.splice(i, 1);
          continue;
        }
        const px = r.player.x, py = r.player.y, pw = r.player.w, ph = r.player.h;

        // near-miss bonus
        if (!o.nearDone && r.nearMissCooldown <= 0 && o.type !== 'gap') {
          const oh = o.h || 28;
          const closeX = px + pw > o.x - 18 && px < o.x + o.w + 18;
          const closeY = py + ph > r.groundY - oh - 20 && py < r.groundY;
          const notHit = !(px + pw > o.x && px < o.x + o.w && py + ph > r.groundY - oh && py < r.groundY);
          if (closeX && closeY && notHit && o.x < px + pw) {
            o.nearDone = true;
            r.nearMissCooldown = 20;
            r.combo = Math.min(9, r.combo + 1);
            r.comboTimer = 90;
            const bonus = 15 * Math.max(1, r.combo);
            r.score += bonus;
            updateUI(r.score, null);
            r.scorePops.push({ x: px + pw, y: py, text: `NEAR +${bonus}`, life: 40 });
            sfx('score');
            flash(0.25);
          }
        }

        // collision
        if (r.invuln > 0) continue;
        if (o.type === 'gap') {
          if (px + pw > o.x + 10 && px < o.x + o.w - 10 && r.player.onGround) {
            r.gameOver = true;
            sfx('die');
            shake(12);
            addParticles(px + pw/2, py + ph, 12, '#ff4d8d');
            drawRunner();
            showGameOver('CIRCUIT BROKEN', 'runner', r.score);
            return;
          }
        } else {
          const oh = o.h || 28;
          if (px + pw > o.x && px < o.x + o.w && py + ph > r.groundY - oh && py < r.groundY) {
            r.gameOver = true;
            sfx('hit');
            sfx('die');
            shake(12);
            addParticles(px + pw/2, py + ph/2, 14, '#ff4d8d');
            drawRunner();
            showGameOver('SYSTEM CRASH', 'runner', r.score);
            return;
          }
        }
      }

      // coins
      for (let i = r.coins.length - 1; i >= 0; i--) {
        const c = r.coins[i];
        c.x -= r.speed;
        if (c.x < -20) { r.coins.splice(i, 1); continue; }
        const dx = (r.player.x + r.player.w/2) - c.x;
        const dy = (r.player.y + r.player.h/2) - c.y;
        if (dx*dx + dy*dy < (c.r + 16)*(c.r + 16)) {
          r.coins.splice(i, 1);
          r.combo = Math.min(9, r.combo + 1);
          r.comboTimer = 90;
          const pts = 25 * Math.max(1, r.combo);
          r.score += pts;
          updateUI(r.score, null);
          r.scorePops.push({ x: c.x, y: c.y, text: `+${pts}`, life: 35 });
          sfx('coin');
          if (r.combo >= 3) flash(0.2);
          addParticles(c.x, c.y, 6, '#ffff66');
        }
      }

      // particles
      for (let i = r.particles.length - 1; i >= 0; i--) {
        const p = r.particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
        if (p.life <= 0) r.particles.splice(i, 1);
      }

      // buildings scroll
      r.buildings.forEach(b => {
        b.x -= r.speed * (b.layer === 1 ? 0.25 : 0.45);
        if (b.x + b.w < 0) {
          b.x = 480 + Math.random() * 100;
          b.h = 60 + Math.random() * 140;
          b.w = 50 + Math.random() * 70;
        }
      });

      if (r.invuln > 0) r.invuln--;

      drawRunner();
      animId = requestAnimationFrame(loopRunner);
    }

    function drawRunner() {
      const r = runner;

      // sky
      const grad = ctx.createLinearGradient(0, 0, 0, 360);
      grad.addColorStop(0, '#050515');
      grad.addColorStop(0.5, '#0a1a2a');
      grad.addColorStop(1, '#001a12');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 480, 360);

      // stars / grid dots
      ctx.fillStyle = '#00ff9f22';
      for (let i = 0; i < 30; i++) {
        const sx = ((i * 97 + r.bgOffset * 0.2) % 500);
        const sy = (i * 53) % 200;
        ctx.fillRect(sx, sy, 2, 2);
      }

      // parallax buildings
      r.buildings.forEach(b => {
        const alpha = b.layer === 1 ? 0.15 : 0.3;
        ctx.fillStyle = `rgba(0, 255, 159, ${alpha})`;
        ctx.fillRect(b.x, r.groundY - b.h, b.w, b.h);
        // windows
        ctx.fillStyle = `rgba(0, 255, 200, ${alpha + 0.2})`;
        for (let wy = 10; wy < b.h - 10; wy += 18) {
          for (let wx = 8; wx < b.w - 8; wx += 14) {
            if (Math.random() > 0.4) ctx.fillRect(b.x + wx, r.groundY - b.h + wy, 5, 5);
          }
        }
      });

      // ground
      ctx.fillStyle = '#003322';
      ctx.fillRect(0, r.groundY, 480, 360 - r.groundY);
      // ground grid lines
      ctx.strokeStyle = '#00ff9f44';
      ctx.lineWidth = 1;
      const gridOff = (r.bgOffset * 1.5) % 40;
      for (let gx = -40; gx < 520; gx += 40) {
        ctx.beginPath();
        ctx.moveTo(gx + gridOff, r.groundY);
        ctx.lineTo(gx + gridOff - 20, 360);
        ctx.stroke();
      }
      ctx.strokeStyle = '#00ff9f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, r.groundY);
      ctx.lineTo(480, r.groundY);
      ctx.stroke();

      // obstacles
      r.obstacles.forEach(o => {
        if (o.type === 'gap') {
          ctx.fillStyle = '#000';
          ctx.fillRect(o.x, r.groundY, o.w, 60);
          ctx.strokeStyle = '#ff4d8d';
          ctx.lineWidth = 2;
          ctx.strokeRect(o.x, r.groundY, o.w, 4);
        } else if (o.type === 'spike') {
          ctx.fillStyle = '#ff4d8d';
          ctx.shadowColor = '#ff4d8d';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(o.x, r.groundY);
          ctx.lineTo(o.x + o.w / 2, r.groundY - o.h);
          ctx.lineTo(o.x + o.w, r.groundY);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = '#00ff9f';
          ctx.shadowColor = '#00ff9f';
          ctx.shadowBlur = 10;
          ctx.fillRect(o.x, r.groundY - o.h, o.w, o.h);
          ctx.shadowBlur = 0;
          // circuit detail
          ctx.strokeStyle = '#003322';
          ctx.lineWidth = 2;
          ctx.strokeRect(o.x + 4, r.groundY - o.h + 4, o.w - 8, o.h - 8);
        }
      });

      // coins
      r.coins.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffff66';
        ctx.shadowColor = '#ffff66';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        ctx.font = '10px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('$', c.x, c.y + 3);
      });

      // particles
      r.particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 30);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1;

      // speed lines
      if (r.speed > 5) {
        ctx.strokeStyle = `rgba(0, 255, 159, ${0.08 + r.speed * 0.015})`;
        ctx.lineWidth = 1;
        for (let i = 0; i < 8; i++) {
          const ly = 40 + i * 35 + (r.frame * 2 + i * 17) % 30;
          const lx = 200 + Math.sin(i * 1.7) * 80;
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.lineTo(lx - 30 - r.speed * 2, ly);
          ctx.stroke();
        }
      }

      // player
      const p = r.player;
      ctx.save();
      if (r.invuln > 0 && Math.floor(r.frame / 3) % 2 === 0) ctx.globalAlpha = 0.4;

      // dash glow
      if (r.dashTimer > 0) {
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 22;
      }

      // body
      ctx.fillStyle = '#00ff9f';
      ctx.shadowColor = '#00ff9f';
      ctx.shadowBlur = 14;
      // rounded-ish body
      ctx.fillRect(p.x, p.y + 4, p.w, p.h - 4);
      ctx.fillRect(p.x + 3, p.y, p.w - 6, 8);

      // visor
      ctx.fillStyle = '#001a12';
      ctx.fillRect(p.x + 5, p.y + 7, p.w - 10, 9);
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(p.x + 7, p.y + 9, p.w - 14, 3);

      // legs / boots
      ctx.fillStyle = '#00cc7a';
      ctx.fillRect(p.x + 4, p.y + p.h - 6, 8, 6);
      ctx.fillRect(p.x + p.w - 12, p.y + p.h - 6, 8, 6);

      // arm detail
      ctx.fillStyle = '#00ff9f';
      ctx.fillRect(p.x - 3, p.y + 14, 5, 12);
      ctx.fillRect(p.x + p.w - 2, p.y + 14, 5, 12);

      // trail / afterimage
      if (!p.onGround || r.speed > 6 || r.dashTimer > 0) {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#00ff9f';
        ctx.fillRect(p.x - 14, p.y + 8, 12, 14);
        ctx.globalAlpha = 0.18;
        ctx.fillRect(p.x - 26, p.y + 12, 10, 10);
      }
      ctx.shadowBlur = 0;
      ctx.restore();

      // score pops
      for (let i = r.scorePops.length - 1; i >= 0; i--) {
        const sp = r.scorePops[i];
        sp.y -= 0.8;
        sp.life--;
        ctx.globalAlpha = Math.max(0, sp.life / 40);
        ctx.fillStyle = '#ffff66';
        ctx.font = 'bold 13px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(sp.text, sp.x, sp.y);
        if (sp.life <= 0) r.scorePops.splice(i, 1);
      }
      ctx.globalAlpha = 1;

      // combo meter
      if (r.combo > 1) {
        ctx.fillStyle = '#ffff66';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'right';
        ctx.fillText(`COMBO x${r.combo}`, 468, 24);
      }

      // high score + speed
      ctx.fillStyle = '#00ff9f';
      ctx.font = '11px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText(`SPD ${Math.floor(r.speed * 12)}`, 12, 22);
      const hs = getHigh('runner');
      if (hs > 0) {
        ctx.fillStyle = '#7dffc8';
        ctx.fillText(`HI ${hs}`, 12, 38);
      }

      // screen flash
      if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(0, 255, 200, ${flashAlpha})`;
        ctx.fillRect(0, 0, 480, 360);
        flashAlpha *= 0.85;
        if (flashAlpha < 0.02) flashAlpha = 0;
      }
    }

    // ========== 10. NEON CLAW ==========
    let claw = {};

    function initClaw() {
      claw = {
        score: 0,
        lives: 5,           // number of drops remaining
        clawX: 240,
        clawY: 50,
        clawOpen: true,
        state: 'ready',     // ready | dropping | rising | grab
        dropSpeed: 0,
        prizes: [],
        particles: [],
        frame: 0,
        grabTarget: null,
        message: '',
        messageTimer: 0
      };
      spawnClawPrizes();
      updateUI(0, 5);
      loopClaw();
    }

    function spawnClawPrizes() {
      claw.prizes = [];
      const types = [
        { label: '$', color: '#ffff66', points: 50, r: 14 },
        { label: 'T', color: '#00ff9f', points: 30, r: 12 },
        { label: '★', color: '#ff66cc', points: 80, r: 13 },
        { label: '●', color: '#66ccff', points: 20, r: 11 },
        { label: '◆', color: '#ffaa44', points: 40, r: 12 }
      ];
      for (let i = 0; i < 9; i++) {
        const t = types[Math.floor(Math.random() * types.length)];
        claw.prizes.push({
          x: 55 + (i % 5) * 85 + (Math.random() - 0.5) * 20,
          y: 240 + Math.floor(i / 5) * 55 + (Math.random() - 0.5) * 15,
          r: t.r,
          label: t.label,
          color: t.color,
          points: t.points,
          grabbed: false,
          vx: 0,
          vy: 0
        });
      }
    }

    function loopClaw() {
      if (currentGame !== 'claw') return;
      const c = claw;
      c.frame++;

      const left  = keys['ArrowLeft'] || keys['a'] || keys['A'] || touchState.left;
      const right = keys['ArrowRight'] || keys['d'] || keys['D'] || touchState.right;
      const drop  = keys[' '] || keys['ArrowDown'] || touchState.fire;

      if (c.state === 'ready') {
        if (left)  c.clawX -= 4.2;
        if (right) c.clawX += 4.2;
        c.clawX = Math.max(40, Math.min(440, c.clawX));

        if (drop) {
          c.state = 'dropping';
          c.dropSpeed = 3.5;
          c.clawOpen = true;
          sfx('drop');
        }
      } else if (c.state === 'dropping') {
        c.clawY += c.dropSpeed;
        c.dropSpeed = Math.min(9, c.dropSpeed + 0.18);

        // Check grab near bottom
        if (c.clawY > 290) {
          c.state = 'grab';
          c.clawOpen = false;
          // Find closest prize under claw
          let best = null;
          let bestDist = 999;
          c.prizes.forEach(p => {
            if (p.grabbed) return;
            const dx = p.x - c.clawX;
            const dy = p.y - (c.clawY + 28);
            const dist = Math.hypot(dx, dy);
            if (dist < bestDist && dist < 28) {
              bestDist = dist;
              best = p;
            }
          });
          if (best && Math.random() > 0.28) {  // 72% success chance when close
            best.grabbed = true;
            c.grabTarget = best;
            c.score += best.points;
            updateUI(c.score, c.lives);
            sfx('grab');
            c.message = `+${best.points} TICKETS`;
            c.messageTimer = 50;
            // particles
            for (let i = 0; i < 10; i++) {
              c.particles.push({
                x: best.x, y: best.y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5 - 2,
                life: 30 + Math.random() * 20,
                color: best.color
              });
            }
          } else {
            sfx('miss');
            c.message = 'MISSED';
            c.messageTimer = 35;
            c.grabTarget = null;
          }
        }
      } else if (c.state === 'grab' || c.state === 'rising') {
        c.state = 'rising';
        c.clawY -= 5.5;
        if (c.grabTarget) {
          c.grabTarget.x = c.clawX;
          c.grabTarget.y = c.clawY + 30;
        }
        if (c.clawY <= 50) {
          c.clawY = 50;
          c.clawOpen = true;
          if (c.grabTarget) {
            // Remove prize
            c.prizes = c.prizes.filter(p => p !== c.grabTarget);
            c.grabTarget = null;
          }
          c.lives--;
          updateUI(c.score, c.lives);
          if (c.lives <= 0) {
            drawClaw();
            shake(8);
            showGameOver(c.score >= 150 ? 'TICKET JACKPOT' : 'CLAW EMPTY', 'claw', c.score);
            return;
          }
          // Respawn prizes if few left
          if (c.prizes.filter(p => !p.grabbed).length < 4) {
            spawnClawPrizes();
          }
          c.state = 'ready';
        }
      }

      // particles
      for (let i = c.particles.length - 1; i >= 0; i--) {
        const p = c.particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
        if (p.life <= 0) c.particles.splice(i, 1);
      }
      if (c.messageTimer > 0) c.messageTimer--;

      drawClaw();
      animId = requestAnimationFrame(loopClaw);
    }

    function drawClaw() {
      const c = claw;
      // background
      const g = ctx.createLinearGradient(0, 0, 0, 360);
      g.addColorStop(0, '#050515');
      g.addColorStop(0.6, '#0a1a18');
      g.addColorStop(1, '#001a12');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 480, 360);

      // glass cabinet frame
      ctx.strokeStyle = '#00ff9f66';
      ctx.lineWidth = 4;
      ctx.strokeRect(20, 20, 440, 320);
      ctx.strokeStyle = '#00ff9f33';
      ctx.lineWidth = 1;
      ctx.strokeRect(28, 28, 424, 304);

      // floor / prize area
      ctx.fillStyle = '#003322';
      ctx.fillRect(40, 310, 400, 30);
      ctx.strokeStyle = '#00ff9f44';
      ctx.beginPath();
      ctx.moveTo(40, 310);
      ctx.lineTo(440, 310);
      ctx.stroke();

      // prizes
      c.prizes.forEach(p => {
        if (p.grabbed && p !== c.grabTarget) return;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.label, p.x, p.y + 1);
      });

      // claw cable
      ctx.strokeStyle = '#00ff9faa';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(c.clawX, 30);
      ctx.lineTo(c.clawX, c.clawY);
      ctx.stroke();

      // claw mechanism
      ctx.fillStyle = '#00ff9f';
      ctx.shadowColor = '#00ff9f';
      ctx.shadowBlur = 10;
      // top block
      ctx.fillRect(c.clawX - 14, c.clawY - 8, 28, 14);
      // arms
      if (c.clawOpen) {
        // open
        ctx.beginPath();
        ctx.moveTo(c.clawX - 10, c.clawY + 6);
        ctx.lineTo(c.clawX - 22, c.clawY + 28);
        ctx.lineTo(c.clawX - 8, c.clawY + 24);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(c.clawX + 10, c.clawY + 6);
        ctx.lineTo(c.clawX + 22, c.clawY + 28);
        ctx.lineTo(c.clawX + 8, c.clawY + 24);
        ctx.closePath();
        ctx.fill();
      } else {
        // closed
        ctx.beginPath();
        ctx.moveTo(c.clawX - 8, c.clawY + 6);
        ctx.lineTo(c.clawX - 6, c.clawY + 26);
        ctx.lineTo(c.clawX + 6, c.clawY + 26);
        ctx.lineTo(c.clawX + 8, c.clawY + 6);
        ctx.closePath();
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // particles
      c.particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1;

      // message
      if (c.messageTimer > 0) {
        ctx.fillStyle = c.message.startsWith('+') ? '#ffff66' : '#ff6b8a';
        ctx.font = 'bold 18px Courier New';
        ctx.textAlign = 'center';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 10;
        ctx.fillText(c.message, 240, 100);
        ctx.shadowBlur = 0;
      }

      // UI
      ctx.fillStyle = '#00ff9f';
      ctx.font = '12px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText(`DROPS ${c.lives}`, 36, 48);
      const hs = getHigh('claw');
      if (hs > 0) {
        ctx.fillStyle = '#7dffc8';
        ctx.fillText(`HI ${hs}`, 36, 66);
      }
      ctx.fillStyle = '#7dffc8';
      ctx.textAlign = 'right';
      ctx.font = '11px Courier New';
      ctx.fillText('TICKETS FOR CHARITY', 444, 48);
    }
  </script>

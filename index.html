      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, 480, 360);
      ctx.fillStyle = '#00ff9f';
      ctx.font = 'bold 26px Courier New';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#00ff9f';
      ctx.shadowBlur = 14;
      ctx.fillText(text, 240, 118);
      ctx.shadowBlur = 0;
      ctx.font = '16px Courier New';
      if (gameKey) {
        ctx.fillText(`SCORE  ${score}`, 240, 160);
        ctx.fillStyle = '#7dffc8';
        ctx.fillText(`HIGH   ${hs}`, 240, 185);
        if (isNew) {
          ctx.fillStyle = '#ffff66';
          ctx.font = 'bold 15px Courier New';
          ctx.fillText('★ NEW HIGH SCORE ★', 240, 215);
          sfx('power');
        }
      }
      // Play Again button visual
      ctx.fillStyle = '#00ff9f';
      ctx.shadowColor = '#00ff9f';
      ctx.shadowBlur = 10;
      ctx.fillRect(150, 250, 180, 42);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      ctx.font = 'bold 16px Courier New';
      ctx.fillText('PLAY AGAIN', 240, 277);
      ctx.fillStyle = '#7dffc8';
      ctx.font = '12px Courier New';
      ctx.fillText('or tap CLOSE', 240, 320);
    }

    // Click/tap on canvas for Play Again
    canvas.addEventListener('click', (e) => {
      if (!currentGame) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = 480 / rect.width;
      const scaleY = 360 / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      // Play Again button area
      if (x >= 150 && x <= 330 && y >= 255 && y <= 295 && lastGameKey) {
        const g = lastGameKey;
        stopGame();
        startGame(g);
      }
    });
    canvas.addEventListener('touchend', (e) => {
      if (!currentGame || !e.changedTouches[0]) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = 480 / rect.width;
      const scaleY = 360 / rect.height;
      const t = e.changedTouches[0];
      const x = (t.clientX - rect.left) * scaleX;
      const y = (t.clientY - rect.top) * scaleY;
      if (x >= 150 && x <= 330 && y >= 255 && y <= 295 && lastGameKey) {
        e.preventDefault();
        const g = lastGameKey;
        stopGame();
        startGame(g);
      }
    }, { passive: false });

    // Apply shake to canvas each frame helper
    function applyShake() {
      if (shakeAmount > 0) {
        const dx = (Math.random() - 0.5) * shakeAmount;
        const dy = (Math.random() - 0.5) * shakeAmount;
        ctx.save();
        ctx.translate(dx, dy);
        shakeAmount *= 0.85;
        if (shakeAmount < 0.5) shakeAmount = 0;
        return true;
      }
      return false;
    }
    function endShake() { ctx.restore(); }

    // ========== VORTEX BANDITS (winding highways → vortex tunnel) ==========
    let racer = {};
    function initRacer() {
      racer = {
        score: 0,
        killScore: 0,
        speed: 5.8,
        maxSpeed: 17.5,
        angle: Math.PI / 2,          // start on the floor
        angVel: 0,
        obstacles: [],
        lasers: [],
        rings: [],
        scenery: [],                 // cyberpunk + pirate side props
        distance: 0,
        lives: 3,
        invuln: 0,
        crashTimer: 0,
        frame: 0,
        lastShot: 0,
        tubeRadius: 112,
        segmentZ: 0,
        mode: 'highway',             // 'highway' | 'tunnel'
        curve: 0,                    // current road curve (-1 .. 1)
        curveTarget: 0,
        tunnelProgress: 0,           // 0..1 transition into full tube
        transitionTimer: 0,
        message: '',
        messageTimer: 0,
        spinBoost: 0,                // residual spin energy for barrel rolls
        nextScenery: 40
      };
      for (let i = 0; i < 7; i++) spawnRacerObstacle();
      for (let i = 0; i < 14; i++) {
        racer.rings.push({ z: 60 + i * 65 });
      }
      // Seed initial cyberpunk / pirate scenery
      for (let i = 0; i < 12; i++) {
        spawnRacerScenery(180 + i * 95 + Math.random() * 40);
      }
      updateUI(0, 3);
      loopRacer();
    }

    function spawnRacerScenery(forcedZ) {
      const r = racer;
      const types = ['building', 'building', 'hologram', 'palm', 'palm', 'pirate', 'ghost', 'hologram'];
      const type = types[Math.floor(Math.random() * types.length)];
      const side = Math.random() > 0.5 ? 1 : -1;
      r.scenery.push({
        z: forcedZ !== undefined ? forcedZ : 620 + Math.random() * 280,
        side: side,
        type: type,
        h: type === 'building' ? 90 + Math.random() * 160 : (type === 'palm' ? 70 + Math.random() * 50 : 50 + Math.random() * 40),
        w: type === 'building' ? 28 + Math.random() * 36 : (type === 'palm' ? 18 : 22 + Math.random() * 20),
        seed: Math.random() * 1000,
        glow: 0.4 + Math.random() * 0.6,
        bob: Math.random() * Math.PI * 2
      });
    }

    function spawnRacerObstacle() {
      const r = racer;
      // Prefer bandits on the lower half of the tube / road early on
      let ang;
      if (r.mode === 'highway' || r.tunnelProgress < 0.7) {
        // mostly near the road surface
        ang = Math.PI / 2 + (Math.random() - 0.5) * 1.4;
      } else {
        ang = Math.random() * Math.PI * 2;
      }
      const isBandit = Math.random() > 0.32;
      r.obstacles.push({
        z: 480 + Math.random() * 420,
        angle: ang,
        size: 0.65 + Math.random() * 0.55,
        hit: false,
        type: isBandit ? 'bandit' : 'drone',
        health: isBandit ? 1 : 1,
        wobble: Math.random() * Math.PI * 2
      });
    }

    function loopRacer() {
      if (currentGame !== 'racer') return;
      const r = racer;
      r.frame++;

      const left  = keys['ArrowLeft'] || keys['a'] || keys['A'] || touchState.left;
      const right = keys['ArrowRight'] || keys['d'] || keys['D'] || touchState.right;
      const fire  = keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W'] || touchState.fire || touchState.up;

      // ===== MODE TRANSITION =====
      if (r.mode === 'highway' && r.distance > 1550) {
        r.mode = 'tunnel';
        r.transitionTimer = 90;
        r.message = 'ENTERING VORTEX';
        r.messageTimer = 70;
        sfx('power');
        flash(0.5);
        shake(8);
      }

      // Tunnel walls gradually close
      if (r.mode === 'tunnel') {
        r.tunnelProgress = Math.min(1, r.tunnelProgress + 0.008);
      }

      // ===== STEERING / ROTATION =====
      // Highway: limited lean + road curve influence
      // Tunnel: free 360° with stronger spin (barrel rolls)
      const maxAngVel = r.mode === 'tunnel' ? 0.085 : 0.028;
      if (left)  r.angVel -= (r.mode === 'tunnel' ? 0.018 : 0.011);
      if (right) r.angVel += (r.mode === 'tunnel' ? 0.018 : 0.011);

      // Friction + residual spin energy (helps hold a barrel roll)
      if (r.mode === 'tunnel' && Math.abs(r.angVel) > 0.04) {
        r.spinBoost = Math.min(1, r.spinBoost + 0.04);
      } else {
        r.spinBoost *= 0.94;
      }
      r.angVel *= (r.mode === 'tunnel' ? 0.91 - r.spinBoost * 0.04 : 0.86);
      r.angVel = Math.max(-maxAngVel, Math.min(maxAngVel, r.angVel));
      r.angle += r.angVel;

      // Highway clamps you near the road surface
      if (r.mode === 'highway') {
        const floor = Math.PI / 2;
        const maxLean = 0.75;
        if (r.angle < floor - maxLean) r.angle = floor - maxLean;
        if (r.angle > floor + maxLean) r.angle = floor + maxLean;
      } else {
        // free wrap
        if (r.angle < 0) r.angle += Math.PI * 2;
        if (r.angle >= Math.PI * 2) r.angle -= Math.PI * 2;
      }

      // Windy road curve (stronger on highway)
      if (r.frame % 40 === 0) {
        r.curveTarget = (Math.random() - 0.5) * (r.mode === 'highway' ? 1.15 : 0.55);
      }
      r.curve += (r.curveTarget - r.curve) * 0.025;
      // player lean also gently pulls the curve
      r.curve += (r.angle - Math.PI / 2) * 0.004;

      // ===== SHOOTING =====
      if (fire && Date.now() - r.lastShot > 165 && r.invuln <= 0) {
        r.lasers.push({
          z: 28,
          angle: r.angle,
          life: 55,
          trail: []
        });
        r.lastShot = Date.now();
        sfx('shoot');
      }

      // Speed & score
      r.speed = Math.min(r.maxSpeed, r.speed + 0.0022);
      r.distance += r.speed;
      // base score from distance + accumulated kill points
      r.score = Math.floor(r.distance / 4.8) + (r.killScore || 0);
      r.segmentZ += r.speed * 1.55;
      if (r.frame % 5 === 0) updateUI(r.score, r.lives);

      // Move lasers + hit detection
      for (let i = r.lasers.length - 1; i >= 0; i--) {
        const L = r.lasers[i];
        L.trail.push({ z: L.z, angle: L.angle });
        if (L.trail.length > 6) L.trail.shift();
        L.z += r.speed * 3.8 + 11;
        L.life--;
        if (L.life <= 0 || L.z > 780) {
          r.lasers.splice(i, 1);
          continue;
        }
        for (let j = r.obstacles.length - 1; j >= 0; j--) {
          const o = r.obstacles[j];
          if (o.hit) continue;
          const dang = Math.abs(Math.atan2(Math.sin(o.angle - L.angle), Math.cos(o.angle - L.angle)));
          if (dang < 0.32 && Math.abs(o.z - L.z) < 48) {
            o.hit = true;
            o.explodeTimer = 20;
            const pts = o.type === 'bandit' ? 55 : 35;
            r.killScore = (r.killScore || 0) + pts;
            r.score = Math.floor(r.distance / 4.8) + r.killScore;
            updateUI(r.score, r.lives);
            sfx('explode');
            flash(0.28);
            shake(5);
            r.lasers.splice(i, 1);
            break;
          }
        }
      }

      // Move obstacles toward camera
      for (let i = r.obstacles.length - 1; i >= 0; i--) {
        const o = r.obstacles[i];
        o.z -= r.speed * 1.62;
        o.wobble += 0.07;

        if (o.hit) {
          o.explodeTimer--;
          if (o.explodeTimer <= 0) {
            r.obstacles.splice(i, 1);
            spawnRacerObstacle();
          }
          continue;
        }

        // Collision
        if (o.z < 58 && o.z > 14 && r.invuln <= 0) {
          const dang = Math.abs(Math.atan2(Math.sin(o.angle - r.angle), Math.cos(o.angle - r.angle)));
          if (dang < 0.40) {
            r.lives--;
            r.crashTimer = 30;
            r.invuln = 65;
            r.speed = Math.max(4.8, r.speed * 0.58);
            sfx('hit');
            shake(13);
            flash(0.48);
            updateUI(r.score, r.lives);
            o.hit = true;
            o.explodeTimer = 14;
            if (r.lives <= 0) {
              drawRacer();
              const msgs = ['BANDIT AMBUSH', 'VORTEX COLLAPSE', 'SYSTEM BREACH', 'ROADKILL'];
              showGameOver(msgs[Math.floor(Math.random() * msgs.length)], 'racer', r.score);
              return;
            }
          }
        }

        if (o.z < 10) {
          r.obstacles.splice(i, 1);
          spawnRacerObstacle();
          r.killScore = (r.killScore || 0) + 6;
          r.score = Math.floor(r.distance / 4.8) + r.killScore;
        }
      }

      // Scroll rings
      r.rings.forEach(ring => {
        ring.z -= r.speed * 1.48;
        if (ring.z < 8) ring.z += 14 * 65;
      });

      // ===== SIDE SCENERY (cyberpunk + pirate) =====
      r.nextScenery--;
      if (r.nextScenery <= 0 && r.scenery.length < 16) {
        spawnRacerScenery();
        r.nextScenery = 28 + Math.random() * 45;
      }
      for (let i = r.scenery.length - 1; i >= 0; i--) {
        const s = r.scenery[i];
        s.z -= r.speed * 1.35;
        s.bob += 0.04;
        if (s.z < 12) {
          r.scenery.splice(i, 1);
        }
      }

      if (r.crashTimer > 0) r.crashTimer--;
      if (r.invuln > 0) r.invuln--;
      if (r.messageTimer > 0) r.messageTimer--;
      if (r.transitionTimer > 0) r.transitionTimer--;

      drawRacer();
      animId = requestAnimationFrame(loopRacer);
    }

    function drawRacer() {
      const r = racer;
      // Vanishing center shifts with road curve (windy feel)
      const cx = 240 + r.curve * 55;
      const cy = 195;
      const R = r.tubeRadius;

      // Deep void
      ctx.fillStyle = '#02000e';
      ctx.fillRect(0, 0, 480, 360);

      // Distant star field / cyber grid dots
      ctx.fillStyle = '#00ff9f28';
      for (let i = 0; i < 45; i++) {
        const sx = (i * 97 + r.frame * 0.35 + r.curve * 30) % 520 - 20;
        const sy = (i * 53 + r.distance * 0.15) % 360;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // ===== CYBERPUNK + PIRATE SIDE SCENERY =====
      // Draw far-to-near so nearer props occlude farther ones
      const sortedScenery = r.scenery.slice().sort((a, b) => b.z - a.z);
      sortedScenery.forEach(s => {
        const scale = 290 / (s.z + 50);
        if (scale < 0.06) return;

        // Place well outside the tube so it feels like city / coast scrolling by
        const baseX = cx + s.side * (R * scale * 1.75 + 55 * scale + 30);
        const groundY = cy + R * scale * 1.35 + 20 * scale;
        const bobY = (s.type === 'ghost' || s.type === 'hologram') ? Math.sin(s.bob) * 6 * scale : 0;
        const alpha = Math.min(0.95, 0.25 + scale * 0.9) * (0.55 + r.tunnelProgress * 0.15);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(baseX, groundY + bobY);

        if (s.type === 'building') {
          // Tall cyberpunk tower with neon edges + window grid
          const bw = s.w * scale;
          const bh = s.h * scale;
          // Main body
          ctx.fillStyle = '#061018';
          ctx.fillRect(-bw / 2, -bh, bw, bh);
          // Neon edge
          ctx.strokeStyle = `rgba(0, 255, 200, ${0.5 + s.glow * 0.4})`;
          ctx.lineWidth = 1.5 * scale + 0.8;
          ctx.strokeRect(-bw / 2, -bh, bw, bh);
          // Windows
          ctx.fillStyle = `rgba(0, 255, 180, ${0.25 + s.glow * 0.35})`;
          const cols = Math.max(2, Math.floor(bw / (7 * scale)));
          const rows = Math.max(3, Math.floor(bh / (9 * scale)));
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              if ((row + col + Math.floor(s.seed)) % 3 === 0) continue; // some dark
              const wx = -bw / 2 + 3 * scale + col * (bw / cols);
              const wy = -bh + 4 * scale + row * (bh / rows);
              ctx.fillRect(wx, wy, Math.max(1.5, 3.5 * scale), Math.max(1.5, 4 * scale));
            }
          }
          // Antenna / dish on top
          ctx.strokeStyle = '#00ffcc';
          ctx.lineWidth = 1.2 * scale;
          ctx.beginPath();
          ctx.moveTo(0, -bh);
          ctx.lineTo(0, -bh - 12 * scale);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, -bh - 14 * scale, 4 * scale, 0, Math.PI * 2);
          ctx.stroke();
          // Side neon strip
          ctx.fillStyle = `rgba(255, 40, 120, ${0.35 + s.glow * 0.3})`;
          ctx.fillRect(-bw / 2 - 2 * scale, -bh * 0.7, 2.5 * scale, bh * 0.4);

        } else if (s.type === 'hologram') {
          // Floating ad / skull / kanji-style panel
          const hw = s.w * scale * 1.3;
          const hh = s.h * scale * 0.7;
          ctx.strokeStyle = `rgba(0, 255, 255, ${0.55 + Math.sin(s.bob * 2) * 0.2})`;
          ctx.lineWidth = 1.5 * scale + 0.5;
          ctx.strokeRect(-hw / 2, -hh - 20 * scale, hw, hh);
          // Inner glow fill
          ctx.fillStyle = `rgba(0, 200, 255, ${0.08 + Math.sin(s.bob) * 0.04})`;
          ctx.fillRect(-hw / 2, -hh - 20 * scale, hw, hh);
          // Simple pirate skull or diamond symbol
          ctx.fillStyle = `rgba(0, 255, 220, ${0.6 + Math.sin(s.bob * 3) * 0.2})`;
          ctx.font = `bold ${Math.max(8, 14 * scale)}px Courier New`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const symbols = ['☠', '◆', '◇', '◈', '⬡'];
          ctx.fillText(symbols[Math.floor(s.seed) % symbols.length], 0, -hh / 2 - 20 * scale);
          // Scan lines
          ctx.strokeStyle = `rgba(0, 255, 255, 0.15)`;
          ctx.lineWidth = 1;
          for (let ly = 0; ly < 4; ly++) {
            const yy = -hh - 20 * scale + (ly + 0.5) * (hh / 4);
            ctx.beginPath();
            ctx.moveTo(-hw / 2 + 2, yy);
            ctx.lineTo(hw / 2 - 2, yy);
            ctx.stroke();
          }

        } else if (s.type === 'palm') {
          // Neon cyber-palm (Vegas / LA cyberpunk coast vibe)
          const ph = s.h * scale;
          // Trunk
          ctx.strokeStyle = '#00aa66';
          ctx.lineWidth = 3.5 * scale;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(4 * scale * s.side, -ph * 0.4, 0, -ph * 0.75);
          ctx.stroke();
          // Fronds
          ctx.strokeStyle = `rgba(0, 255, 140, ${0.7 + s.glow * 0.25})`;
          ctx.lineWidth = 2 * scale;
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 8 * scale;
          for (let f = 0; f < 5; f++) {
            const ang = -Math.PI / 2 + (f - 2) * 0.45 + Math.sin(s.bob + f) * 0.08;
            ctx.beginPath();
            ctx.moveTo(0, -ph * 0.72);
            ctx.quadraticCurveTo(
              Math.cos(ang) * 18 * scale,
              -ph * 0.72 + Math.sin(ang) * 10 * scale,
              Math.cos(ang) * 28 * scale,
              -ph * 0.55 + Math.sin(ang) * 22 * scale
            );
            ctx.stroke();
          }
          ctx.shadowBlur = 0;
          // Small coconut / node
          ctx.fillStyle = '#00ff9f';
          ctx.beginPath();
          ctx.arc(0, -ph * 0.7, 2.5 * scale, 0, Math.PI * 2);
          ctx.fill();

        } else if (s.type === 'pirate') {
          // Neon pirate ship silhouette (side view, scrolling past)
          const pw = s.w * scale * 1.6;
          const ph = s.h * scale * 0.9;
          ctx.strokeStyle = `rgba(0, 255, 180, ${0.65 + s.glow * 0.3})`;
          ctx.fillStyle = `rgba(0, 40, 30, 0.6)`;
          ctx.lineWidth = 1.8 * scale;
          ctx.shadowColor = '#00ff9f';
          ctx.shadowBlur = 10 * scale;
          // Hull
          ctx.beginPath();
          ctx.moveTo(-pw / 2, 0);
          ctx.lineTo(-pw / 2 + 6 * scale, -ph * 0.25);
          ctx.lineTo(pw / 2 - 4 * scale, -ph * 0.22);
          ctx.lineTo(pw / 2, 0);
          ctx.lineTo(-pw / 2, 0);
          ctx.fill();
          ctx.stroke();
          // Mast
          ctx.beginPath();
          ctx.moveTo(-4 * scale, -ph * 0.22);
          ctx.lineTo(-4 * scale, -ph * 0.95);
          ctx.stroke();
          // Sail (triangle)
          ctx.fillStyle = `rgba(0, 255, 159, ${0.15 + Math.sin(s.bob) * 0.05})`;
          ctx.beginPath();
          ctx.moveTo(-4 * scale, -ph * 0.9);
          ctx.lineTo(-4 * scale, -ph * 0.35);
          ctx.lineTo(pw * 0.35, -ph * 0.55);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          // Skull flag
          ctx.fillStyle = '#00ff9f';
          ctx.font = `bold ${Math.max(7, 11 * scale)}px Courier New`;
          ctx.textAlign = 'center';
          ctx.fillText('☠', -4 * scale, -ph * 0.98);
          ctx.shadowBlur = 0;

        } else if (s.type === 'ghost') {
          // Ethereal pirate ghost (translucent floating figure)
          const gh = s.h * scale * 1.1;
          ctx.shadowColor = '#66ffcc';
          ctx.shadowBlur = 14 * scale;
          // Body wisps
          ctx.strokeStyle = `rgba(100, 255, 220, ${0.45 + Math.sin(s.bob * 1.5) * 0.2})`;
          ctx.lineWidth = 2 * scale;
          ctx.beginPath();
          ctx.moveTo(0, -gh * 0.15);
          ctx.quadraticCurveTo(-12 * scale, -gh * 0.4, -8 * scale, -gh * 0.7);
          ctx.quadraticCurveTo(0, -gh * 0.85, 8 * scale, -gh * 0.7);
          ctx.quadraticCurveTo(12 * scale, -gh * 0.4, 0, -gh * 0.15);
          ctx.stroke();
          // Head
          ctx.beginPath();
          ctx.arc(0, -gh * 0.78, 7 * scale, 0, Math.PI * 2);
          ctx.stroke();
          // Eyes (glowing)
          ctx.fillStyle = `rgba(0, 255, 200, ${0.7 + Math.sin(s.bob * 4) * 0.25})`;
          ctx.beginPath();
          ctx.arc(-2.5 * scale, -gh * 0.8, 1.8 * scale, 0, Math.PI * 2);
          ctx.arc(2.5 * scale, -gh * 0.8, 1.8 * scale, 0, Math.PI * 2);
          ctx.fill();
          // Tricorn / hat suggestion
          ctx.strokeStyle = `rgba(0, 255, 180, 0.5)`;
          ctx.beginPath();
          ctx.moveTo(-9 * scale, -gh * 0.88);
          ctx.lineTo(0, -gh * 1.05);
          ctx.lineTo(9 * scale, -gh * 0.88);
          ctx.stroke();
          // Trailing ectoplasm
          ctx.strokeStyle = `rgba(80, 255, 200, 0.25)`;
          ctx.beginPath();
          ctx.moveTo(-4 * scale, -gh * 0.1);
          ctx.quadraticCurveTo(-10 * scale, 8 * scale, -6 * scale, 16 * scale);
          ctx.moveTo(4 * scale, -gh * 0.1);
          ctx.quadraticCurveTo(10 * scale, 10 * scale, 5 * scale, 18 * scale);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        ctx.restore();
      });

      // === Perspective rings (highway = lower arc only, tunnel = full) ===
      const sortedRings = r.rings.slice().sort((a, b) => b.z - a.z);
      const openAmount = 1 - r.tunnelProgress; // 1 = fully open road, 0 = closed tube

      sortedRings.forEach(ring => {
        const scale = 290 / (ring.z + 38);
        if (scale < 0.07) return;
        const rr = R * scale * 1.75;
        const alpha = Math.min(0.75, 0.12 + scale * 0.55);

        // Full circle only when tunnel is closed enough
        const startA = openAmount > 0.15 ? Math.PI * 0.15 + openAmount * 0.9 : 0;
        const endA   = openAmount > 0.15 ? Math.PI * 1.85 - openAmount * 0.9 : Math.PI * 2;

        // Outer neon ring
        ctx.strokeStyle = `rgba(0, 255, 180, ${alpha * (0.5 + r.tunnelProgress * 0.5)})`;
        ctx.lineWidth = 1.5 + scale * 2.8;
        ctx.beginPath();
        ctx.arc(cx, cy, rr, startA, endA);
        ctx.stroke();

        // Inner detail
        if (scale > 0.18) {
          ctx.strokeStyle = `rgba(0, 200, 255, ${alpha * 0.4})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx, cy, rr * 0.91, startA, endA);
          ctx.stroke();
        }

        // Structural ribs (wireframe cyberpunk)
        if (scale > 0.28) {
          ctx.strokeStyle = `rgba(0, 255, 159, ${alpha * 0.3})`;
          ctx.lineWidth = 1;
          const ribs = r.mode === 'tunnel' ? 10 : 6;
          for (let k = 0; k < ribs; k++) {
            const a = (k / ribs) * Math.PI * 2 + r.segmentZ * 0.0018;
            // only draw ribs that are on the visible arc
            if (openAmount > 0.2) {
              const norm = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
              if (norm < startA || norm > endA) continue;
            }
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * rr * 0.65, cy + Math.sin(a) * rr * 0.65);
            ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
            ctx.stroke();
          }
        }
      });

      // Horizon vanishing circle
      ctx.strokeStyle = 'rgba(0, 255, 210, 0.22)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, 14 + openAmount * 8, 0, Math.PI * 2);
      ctx.stroke();

      // Road surface glow on highway (bottom plane)
      if (openAmount > 0.25) {
        ctx.fillStyle = `rgba(0, 255, 159, ${0.04 * openAmount})`;
        ctx.beginPath();
        ctx.moveTo(cx - 180, 360);
        ctx.lineTo(cx - 30, cy + 20);
        ctx.lineTo(cx + 30, cy + 20);
        ctx.lineTo(cx + 180, 360);
        ctx.closePath();
        ctx.fill();
        // center dashed line
        ctx.strokeStyle = `rgba(0, 255, 200, ${0.25 * openAmount})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([12, 18]);
        ctx.beginPath();
        ctx.moveTo(cx, cy + 25);
        ctx.lineTo(cx + r.curve * 20, 355);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Project a point on the tube / road into screen space
      function tubeProject(angle, z) {
        const scale = 290 / (z + 38);
        const rr = R * scale * 1.75;
        const rel = angle - r.angle + Math.PI / 2;
        const px = cx + Math.cos(rel) * rr;
        const py = cy + Math.sin(rel) * rr;
        return { x: px, y: py, s: scale, rr };
      }

      // ===== OBSTACLES / BANDITS =====
      r.obstacles.forEach(o => {
        const p = tubeProject(o.angle, o.z);
        if (p.s < 0.07) return;

        if (o.hit) {
          const t = o.explodeTimer / 20;
          ctx.fillStyle = `rgba(255, 70, 130, ${t})`;
          ctx.shadowColor = '#ff2a6a';
          ctx.shadowBlur = 18;
          for (let k = 0; k < 7; k++) {
            const a = (k / 7) * Math.PI * 2 + r.frame * 0.25;
            const dist = (1 - t) * 34 * p.s;
            ctx.beginPath();
            ctx.arc(p.x + Math.cos(a) * dist, p.y + Math.sin(a) * dist, 3.5 * p.s * t + 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.shadowBlur = 0;
          return;
        }

        const sz = 15 * p.s * o.size;

        if (o.type === 'bandit') {
          // Wireframe cyberpunk bandit (stick + geometric)
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.scale(p.s * o.size, p.s * o.size);
          const wob = Math.sin(o.wobble) * 3;

          ctx.strokeStyle = '#ff4d8d';
          ctx.fillStyle = '#ff4d8d';
          ctx.lineWidth = 1.8;
          ctx.shadowColor = '#ff4d8d';
          ctx.shadowBlur = 10;

          // head
          ctx.beginPath();
          ctx.arc(0, -18 + wob * 0.3, 7, 0, Math.PI * 2);
          ctx.stroke();
          // body
          ctx.beginPath();
          ctx.moveTo(0, -11);
          ctx.lineTo(0, 6);
          ctx.stroke();
          // arms (one raised weapon)
          ctx.beginPath();
          ctx.moveTo(0, -6);
          ctx.lineTo(-12, 2 + wob);
          ctx.moveTo(0, -6);
          ctx.lineTo(11, -4 + wob * 0.5);
          ctx.stroke();
          // legs
          ctx.beginPath();
          ctx.moveTo(0, 6);
          ctx.lineTo(-8, 18);
          ctx.moveTo(0, 6);
          ctx.lineTo(8, 18);
          ctx.stroke();
          // visor / eye
          ctx.fillStyle = '#00ffff';
          ctx.fillRect(-4, -20, 8, 3);
          // weapon glow
          ctx.fillStyle = '#ffaa00';
          ctx.beginPath();
          ctx.arc(12, -5, 2.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.restore();
        } else {
          // Drone – angular wireframe
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(o.wobble * 0.4);
          ctx.strokeStyle = '#ff3366';
          ctx.lineWidth = 1.6 * p.s + 0.8;
          ctx.shadowColor = '#ff3366';
          ctx.shadowBlur = 11;
          const s = sz;
          ctx.beginPath();
          ctx.moveTo(0, -s);
          ctx.lineTo(s * 0.9, 0);
          ctx.lineTo(0, s * 0.7);
          ctx.lineTo(-s * 0.9, 0);
          ctx.closePath();
          ctx.stroke();
          // core
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(0, 0, 2.5 * p.s, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.restore();
        }
      });

      // ===== LASERS (improved trails) =====
      r.lasers.forEach(L => {
        // main beam
        const p1 = tubeProject(L.angle, L.z);
        const p2 = tubeProject(L.angle, L.z + 55);
        if (p1.s < 0.04) return;

        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3.2 * p1.s + 1.8;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        // trail segments (fading)
        if (L.trail && L.trail.length > 1) {
          for (let t = 0; t < L.trail.length - 1; t++) {
            const a = L.trail[t];
            const b = L.trail[t + 1];
            const pa = tubeProject(a.angle, a.z);
            const pb = tubeProject(b.angle, b.z);
            const alpha = (t / L.trail.length) * 0.55;
            ctx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
            ctx.lineWidth = 1.5 * pa.s + 1;
            ctx.beginPath();
            ctx.moveTo(pa.x, pa.y);
            ctx.lineTo(pb.x, pb.y);
            ctx.stroke();
          }
        }
        ctx.shadowBlur = 0;
      });

      // ===== PLAYER SHIP =====
      const shipY = cy + R * 0.92;
      const shipX = cx;

      ctx.save();
      if (r.crashTimer > 0 || (r.invuln > 0 && Math.floor(r.frame / 3) % 2 === 0)) {
        ctx.globalAlpha = 0.35 + Math.sin(r.frame * 0.55) * 0.25;
      }

      // slight tilt based on angVel for feel
      ctx.translate(shipX, shipY);
      ctx.rotate(r.angVel * 4.5);

      // ship body – angular cyber
      ctx.fillStyle = '#00ff9f';
      ctx.shadowColor = '#00ff9f';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.moveTo(0, -30);
      ctx.lineTo(-20, 16);
      ctx.lineTo(-7, 8);
      ctx.lineTo(7, 8);
      ctx.lineTo(20, 16);
      ctx.closePath();
      ctx.fill();

      // cockpit
      ctx.fillStyle = '#002218';
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(-7, -2);
      ctx.lineTo(7, -2);
      ctx.closePath();
      ctx.fill();

      // engine
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 14;
      ctx.fillRect(-5, 12, 10, 9);

      // barrel-roll indicator (spinning chevrons when spinning hard)
      if (r.mode === 'tunnel' && Math.abs(r.angVel) > 0.04) {
        ctx.strokeStyle = '#ffff66';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.arc(0, 0, 38, 0, Math.PI * 1.4);
        ctx.stroke();
      }

      ctx.shadowBlur = 0;
      ctx.restore();

      // Speed lines (radial)
      if (r.speed > 6.5) {
        ctx.strokeStyle = `rgba(0, 255, 200, ${0.07 + r.speed * 0.009})`;
        ctx.lineWidth = 1.4;
        for (let i = 0; i < 9; i++) {
          const a = (i / 9) * Math.PI * 2 + r.frame * 0.012;
          const inner = 35 + (r.frame + i * 18) % 70;
          const outer = inner + 28 + r.speed;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
          ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
          ctx.stroke();
        }
      }

      // ===== HUD =====
      ctx.fillStyle = '#00ff9f';
      ctx.font = '12px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText(`SPD ${Math.floor(r.speed * 13)}`, 12, 22);
      ctx.fillText(`LIVES ${r.lives}`, 12, 40);
      const hs = getHigh('racer');
      if (hs > 0) {
        ctx.fillStyle = '#7dffc8';
        ctx.fillText(`HI ${hs}`, 12, 58);
      }

      // Mode + position
      ctx.fillStyle = '#7dffc8';
      ctx.font = '11px Courier New';
      ctx.textAlign = 'right';
      if (r.mode === 'highway') {
        ctx.fillText('HIGHWAY', 468, 22);
        ctx.fillText('← → STEER  SPACE FIRE', 468, 40);
      } else {
        const deg = Math.floor((r.angle * 180 / Math.PI) % 360);
        let wallLabel = 'FLOOR';
        if (deg > 40 && deg < 140) wallLabel = 'RIGHT WALL';
        else if (deg >= 140 && deg < 220) wallLabel = 'CEILING';
        else if (deg >= 220 && deg < 320) wallLabel = 'LEFT WALL';
        ctx.fillText('VORTEX  ' + wallLabel, 468, 22);
        ctx.fillText('← → BARREL ROLL  SPACE FIRE', 468, 40);
      }

      // Transition / message banner
      if (r.messageTimer > 0) {
        ctx.fillStyle = `rgba(0, 255, 159, ${0.15 + Math.sin(r.frame * 0.3) * 0.08})`;
        ctx.fillRect(0, 70, 480, 36);
        ctx.fillStyle = '#00ff9f';
        ctx.font = 'bold 16px Courier New';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#00ff9f';
        ctx.shadowBlur = 12;
        ctx.fillText(r.message, 240, 94);
        ctx.shadowBlur = 0;
      }

      // Tunnel closing flash overlay
      if (r.transitionTimer > 0) {
        const t = r.transitionTimer / 90;
        ctx.fillStyle = `rgba(0, 255, 200, ${t * 0.18})`;
        ctx.fillRect(0, 0, 480, 360);
      }
    }

    // ========== 2. NEON SWARM ==========
    let swarm = {};
    function initSwarm() {
      swarm = { score: 0, lives: 3, player: { x: 220, y: 320, w: 42, h: 14 }, bullets: [], enemies: [], dir: 1, speed: 0.7, lastShot: 0 };
      createSwarmEnemies();
      updateUI(0, 3);
      loopSwarm();
    }
    function createSwarmEnemies() {
      swarm.enemies = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++)
        swarm.enemies.push({ x: 48 + c * 48, y: 36 + r * 34, w: 26, h: 18, alive: true });
    }
    function loopSwarm() {
      if (currentGame !== 'swarm') return;
      const s = swarm;
      const left = keys['ArrowLeft'] || keys['a'] || keys['A'] || touchState.left;
      const right = keys['ArrowRight'] || keys['d'] || keys['D'] || touchState.right;
      const fire = keys[' '] || touchState.fire;
      if (left) s.player.x -= 5.5;
      if (right) s.player.x += 5.5;
      s.player.x = Math.max(4, Math.min(434, s.player.x));
      if (fire && Date.now() - s.lastShot > 220) {
        s.bullets.push({ x: s.player.x + s.player.w/2 - 1.5, y: s.player.y - 10 });
        s.lastShot = Date.now();
        sfx('shoot');
      }
      for (let i = s.bullets.length-1; i >= 0; i--) {
        s.bullets[i].y -= 8.5;
        if (s.bullets[i].y < -15) s.bullets.splice(i, 1);
      }
      let hitEdge = false;
      s.enemies.forEach(e => {
        if (!e.alive) return;
        e.x += s.speed * s.dir;
        if (e.x < 6 || e.x + e.w > 474) hitEdge = true;
      });
      if (hitEdge) {
        s.dir *= -1;
        s.enemies.forEach(e => { if (e.alive) e.y += 15; });
        s.speed += 0.045;
      }
      for (let bi = s.bullets.length-1; bi >= 0; bi--) {
        const b = s.bullets[bi];
        for (const e of s.enemies) {
          if (!e.alive) continue;
          if (b.x < e.x+e.w && b.x+3 > e.x && b.y < e.y+e.h && b.y+10 > e.y) {
            e.alive = false; s.bullets.splice(bi,1); s.score += 10; updateUI(s.score, s.lives); sfx('explode'); break;
          }
        }
      }
      if (s.enemies.every(e => !e.alive)) { createSwarmEnemies(); s.speed += 0.2; }
      for (const e of s.enemies) {
        if (e.alive && e.y + e.h >= s.player.y) {
          s.lives--; updateUI(s.score, s.lives);
          if (s.lives <= 0) { drawSwarm(); shake(10); showGameOver('SYSTEM FAILURE', 'swarm', s.score); return; }
          s.enemies.forEach(en => { if (en.alive) en.y -= 50; });
          break;
        }
      }
      drawSwarm();
      animId = requestAnimationFrame(loopSwarm);
    }
    function drawSwarm() {
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,480,360);
      ctx.fillStyle = '#00ff9f'; ctx.shadowColor = '#00ff9f'; ctx.shadowBlur = 8;
      ctx.fillRect(swarm.player.x, swarm.player.y, swarm.player.w, swarm.player.h);
      ctx.beginPath();
      ctx.moveTo(swarm.player.x+6, swarm.player.y);
      ctx.lineTo(swarm.player.x + swarm.player.w/2, swarm.player.y-12);
      ctx.lineTo(swarm.player.x + swarm.player.w-6, swarm.player.y);
      ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      swarm.bullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 11));
      swarm.enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = '#00ff9f'; ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#000'; ctx.fillRect(e.x+5, e.y+5, 4, 4); ctx.fillRect(e.x+17, e.y+5, 4, 4);
      });
    }

    // ========== 4. GLOW WORM ==========
    let worm = {};
    function initWorm() {
      worm = { score: 0, snake: [{x:11,y:9},{x:10,y:9},{x:9,y:9}], dir:{x:1,y:0}, nextDir:{x:1,y:0}, food:{x:16,y:9}, lastMove:0, moveDelay:130, gameOver:false };
      placeFood(); updateUI(0, null); loopWorm();
    }
    function placeFood() {
      let ok = false;
      while (!ok) {
        worm.food.x = Math.floor(Math.random()*24);
        worm.food.y = Math.floor(Math.random()*18);
        ok = !worm.snake.some(s => s.x === worm.food.x && s.y === worm.food.y);
      }
    }
    function loopWorm() {
      if (currentGame !== 'worm') return;
      if ((keys['ArrowUp']||keys['w']||keys['W']||touchState.up) && worm.dir.y===0) worm.nextDir={x:0,y:-1};
      if ((keys['ArrowDown']||keys['s']||keys['S']||touchState.down) && worm.dir.y===0) worm.nextDir={x:0,y:1};
      if ((keys['ArrowLeft']||keys['a']||keys['A']||touchState.left) && worm.dir.x===0) worm.nextDir={x:-1,y:0};
      if ((keys['ArrowRight']||keys['d']||keys['D']||touchState.right) && worm.dir.x===0) worm.nextDir={x:1,y:0};
      const now = Date.now();
      if (now - worm.lastMove >= worm.moveDelay && !worm.gameOver) {
        worm.lastMove = now;
        worm.dir = {...worm.nextDir};
        const head = { x: worm.snake[0].x + worm.dir.x, y: worm.snake[0].y + worm.dir.y };
        if (head.x < 0) head.x = 23; if (head.x > 23) head.x = 0;
        if (head.y < 0) head.y = 17; if (head.y > 17) head.y = 0;
        if (worm.snake.some(seg => seg.x===head.x && seg.y===head.y)) { worm.gameOver = true; sfx('die'); }
        else {
          worm.snake.unshift(head);
          if (head.x === worm.food.x && head.y === worm.food.y) {
            worm.score += 10; updateUI(worm.score, null); placeFood(); sfx('coin');
            worm.moveDelay = Math.max(55, worm.moveDelay - 5);
          } else worm.snake.pop();
        }
      }
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,480,360);
      ctx.fillStyle = '#ff4d8d'; ctx.shadowColor = '#ff4d8d'; ctx.shadowBlur = 10;
      ctx.fillRect(worm.food.x*20+3, worm.food.y*20+3, 14, 14); ctx.shadowBlur = 0;
      worm.snake.forEach((seg,i) => {
        ctx.fillStyle = i===0 ? '#00ff9f' : '#00cc7a';
        ctx.fillRect(seg.x*20+1, seg.y*20+1, 18, 18);
      });
      if (worm.gameOver) { shake(8); showGameOver('WORM DOWN', 'worm', worm.score); return; }
      animId = requestAnimationFrame(loopWorm);
    }

    // ========== 5. PULSE PADDLE ==========
    let paddle = {};
    function initPaddle() {
      paddle = { score:0, lives:3, paddle:{x:190,y:330,w:100,h:12}, ball:{x:240,y:300,vx:3.4,vy:-3.9,r:7}, bricks:[], cols:8, rows:5 };
      createBricks(); updateUI(0,3); loopPaddle();
    }
    function createBricks() {
      paddle.bricks = [];
      const bw=52, bh=18;
      for (let r=0;r<paddle.rows;r++) for (let c=0;c<paddle.cols;c++)
        paddle.bricks.push({x:16+c*(bw+6), y:40+r*(bh+8), w:bw, h:bh, alive:true});
    }
    function loopPaddle() {
      if (currentGame !== 'paddle') return;
      const p = paddle;
      const left = keys['ArrowLeft']||keys['a']||keys['A']||touchState.left;
      const right = keys['ArrowRight']||keys['d']||keys['D']||touchState.right;
      if (left) p.paddle.x -= 6.8; if (right) p.paddle.x += 6.8;
      p.paddle.x = Math.max(0, Math.min(480-p.paddle.w, p.paddle.x));
      p.ball.x += p.ball.vx; p.ball.y += p.ball.vy;
      if (p.ball.x - p.ball.r < 0 || p.ball.x + p.ball.r > 480) p.ball.vx *= -1;
      if (p.ball.y - p.ball.r < 0) p.ball.vy *= -1;
      if (p.ball.y + p.ball.r >= p.paddle.y && p.ball.y - p.ball.r <= p.paddle.y + p.paddle.h &&
          p.ball.x > p.paddle.x && p.ball.x < p.paddle.x + p.paddle.w) {
        p.ball.vy = -Math.abs(p.ball.vy);
        const hitPos = (p.ball.x - p.paddle.x) / p.paddle.w;
        p.ball.vx = (hitPos - 0.5) * 8.5;
      }
      for (const b of p.bricks) {
        if (!b.alive) continue;
        if (p.ball.x + p.ball.r > b.x && p.ball.x - p.ball.r < b.x + b.w &&
            p.ball.y + p.ball.r > b.y && p.ball.y - p.ball.r < b.y + b.h) {
          b.alive = false; p.ball.vy *= -1; p.score += 10; updateUI(p.score, p.lives); sfx('score'); break;
        }
      }
      if (p.ball.y > 370) {
        p.lives--; updateUI(p.score, p.lives);
        if (p.lives <= 0) { drawPaddle(); shake(8); showGameOver('PADDLE DOWN', 'paddle', p.score); return; }
        p.ball.x=240; p.ball.y=300; p.ball.vx=3.4*(Math.random()>0.5?1:-1); p.ball.vy=-3.9;
      }
      if (p.bricks.every(b => !b.alive)) { createBricks(); p.ball.vx*=1.07; p.ball.vy*=1.07; }
      drawPaddle(); animId = requestAnimationFrame(loopPaddle);
    }
    function drawPaddle() {
      ctx.fillStyle='#000'; ctx.fillRect(0,0,480,360);
      paddle.bricks.forEach(b => { if (b.alive) { ctx.fillStyle='#00ff9f'; ctx.fillRect(b.x,b.y,b.w,b.h); }});
      ctx.fillStyle='#00ff9f'; ctx.shadowColor='#00ff9f'; ctx.shadowBlur=8;
      ctx.fillRect(paddle.paddle.x, paddle.paddle.y, paddle.paddle.w, paddle.paddle.h); ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(paddle.ball.x, paddle.ball.y, paddle.ball.r, 0, Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    }

    // ========== 6. YETI SLOPES ==========
    let yeti = {};
    function initYeti() {
      yeti = {
        score: 0, skier: { x: 230, y: 140 }, trees: [], speed: 2.6,
        yetiActive: false, yeti: { x: 200, y: -90 }, frame: 0, gameOver: false,
        warning: 0, snow: [], trail: []
      };
      for (let i = 0; i < 12; i++) {
        yeti.trees.push({
          x: 40 + Math.random()*400,
          y: 60 + i*40 + Math.random()*35,
          h: 28 + Math.random()*18,
          lean: (Math.random()-0.5)*0.3
        });
      }
      for (let i = 0; i < 40; i++) {
        yeti.snow.push({ x: Math.random()*480, y: Math.random()*360, s: 1+Math.random()*2, vy: 0.5+Math.random()*1.5 });
      }
      updateUI(0, null);
      loopYeti();
    }
    function loopYeti() {
      if (currentGame !== 'yeti') return;
      if (yeti.gameOver) return;

      const left  = keys['ArrowLeft'] || keys['a'] || keys['A'] || touchState.left;
      const right = keys['ArrowRight'] || keys['d'] || keys['D'] || touchState.right;
      const up    = keys['ArrowUp'] || keys['w'] || keys['W'] || touchState.up;
      const down  = keys['ArrowDown'] || keys['s'] || keys['S'] || touchState.down;

      if (left)  yeti.skier.x -= 5.5;
      if (right) yeti.skier.x += 5.5;
      if (up)    yeti.skier.y -= 3.8;
      if (down)  yeti.skier.y += 3.8;

      yeti.skier.x = Math.max(25, Math.min(455, yeti.skier.x));
      yeti.skier.y = Math.max(60, Math.min(280, yeti.skier.y));

      yeti.frame++;
      yeti.speed += 0.0018;
      yeti.score += 1;
      if (yeti.frame % 5 === 0) updateUI(yeti.score, null);

      // snow particles
      yeti.snow.forEach(s => {
        s.y += s.vy + yeti.speed * 0.3;
        s.x += Math.sin(yeti.frame * 0.02 + s.x) * 0.4;
        if (s.y > 360) { s.y = -5; s.x = Math.random()*480; }
      });

      // ski trail
      if (yeti.frame % 2 === 0) {
        yeti.trail.push({ x: yeti.skier.x, y: yeti.skier.y + 16, life: 25 });
      }
      for (let i = yeti.trail.length-1; i >= 0; i--) {
        yeti.trail[i].life--;
        yeti.trail[i].y -= yeti.speed * 0.5;
        if (yeti.trail[i].life <= 0) yeti.trail.splice(i, 1);
      }

      // trees scroll
      for (let i = yeti.trees.length-1; i >= 0; i--) {
        yeti.trees[i].y -= yeti.speed;
        if (yeti.trees[i].y < -60) {
          yeti.trees.splice(i, 1);
          yeti.trees.push({
            x: 30 + Math.random()*420,
            y: 360 + Math.random()*100,
            h: 28 + Math.random()*18,
            lean: (Math.random()-0.5)*0.3
          });
        }
      }

      // tree collision
      for (const t of yeti.trees) {
        if (Math.abs(t.x - yeti.skier.x) < 20 && Math.abs(t.y - yeti.skier.y) < 26) {
          yeti.gameOver = true;
          drawYeti();
          shake(10);
          showGameOver('TREE HUGGED', 'yeti', yeti.score);
          return;
        }
      }

      // Yeti warning + spawn (earlier + more dramatic)
      if (yeti.score > 280 && !yeti.yetiActive && yeti.warning === 0) {
        yeti.warning = 110;
        sfx('power');
      }
      if (yeti.warning > 0) {
        yeti.warning--;
        if (yeti.warning === 0) {
          yeti.yetiActive = true;
          yeti.yeti.y = -80;
          yeti.yeti.x = yeti.skier.x + (Math.random() - 0.5) * 60;
          sfx('hit');
          shake(6);
        }
      }

      if (yeti.yetiActive) {
        const dx = yeti.skier.x - yeti.yeti.x;
        const dy = yeti.skier.y - yeti.yeti.y;
        // Yeti gets faster and more aggressive over time
        const chase = 2.6 + yeti.speed * 0.22 + Math.min(2.2, yeti.score / 900);
        yeti.yeti.x += Math.sign(dx) * Math.min(Math.abs(dx), chase);
        yeti.yeti.y += Math.min(3.6, yeti.speed * 0.85 + 1.4);

        if (Math.abs(yeti.yeti.x - yeti.skier.x) < 28 && Math.abs(yeti.yeti.y - yeti.skier.y) < 32) {
          yeti.gameOver = true;
          drawYeti();
          shake(14);
          flash(0.4);
          const deaths = ['GOT SNOGGED', 'YETI HUGGED', 'SNOW ANGEL', 'FROZEN SNACK'];
          showGameOver(deaths[Math.floor(Math.random() * deaths.length)], 'yeti', yeti.score);
          return;
        }
      }

      drawYeti();
      animId = requestAnimationFrame(loopYeti);
    }
    function drawYeti() {
      // cold night gradient

      // distant mountain silhouette
      ctx.fillStyle = '#00ff9f08';
      ctx.beginPath();
      ctx.moveTo(0, 200);
      ctx.lineTo(80, 120); ctx.lineTo(160, 180); ctx.lineTo(260, 90);
      ctx.lineTo(340, 150); ctx.lineTo(420, 100); ctx.lineTo(480, 160);
      ctx.lineTo(480, 360); ctx.lineTo(0, 360);

      yeti.snow.forEach(s => {
        ctx.fillStyle = `rgba(200, 255, 230, ${0.3 + s.s * 0.15})`;

      // ski trail

        ctx.globalAlpha = t.life / 30;

      });
      ctx.globalAlpha = 1;

      // trees (layered neon pines)

        const lean = t.lean || 0;
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(lean);
        // trunk
        ctx.fillStyle = '#003318';
        ctx.fillRect(-3, 0, 6, t.h * 0.45);
        // layered foliage
        const layers = 3;
        for (let i = 0; i < layers; i++) {
          const yy = -t.h * 0.55 + i * (t.h * 0.28);
          const ww = t.h * 0.55 - i * 6;
          ctx.fillStyle = i === 0 ? '#00ff9f' : (i === 1 ? '#00cc7a' : '#00995a');
          ctx.beginPath();
          ctx.moveTo(0, yy - 8);
          ctx.lineTo(-ww, yy + t.h * 0.32);
          ctx.lineTo(ww, yy + t.h * 0.32);
          ctx.closePath();
          ctx.fill();
        }
        // snow cap
        ctx.fillStyle = '#e8fff5';
        ctx.beginPath();
        ctx.moveTo(0, -t.h * 0.55 - 8);
        ctx.lineTo(-8, -t.h * 0.4);
        ctx.lineTo(8, -t.h * 0.4);
        ctx.fill();
        ctx.restore();
      });

      // skier — more realistic athletic stance
      const sk = yeti.skier;
      ctx.save();
      ctx.translate(sk.x, sk.y);
      const leanX = (keys['ArrowLeft'] || keys['a'] || touchState.left) ? -0.28 :
                    (keys['ArrowRight'] || keys['d'] || touchState.right) ? 0.28 : 0;
      ctx.rotate(leanX);
      ctx.shadowColor = '#00ff9f';
      ctx.shadowBlur = 10;

      // Skis (longer, parallel, realistic)
      ctx.fillStyle = '#00e6a0';
      ctx.fillRect(-28, 18, 26, 4);   // left ski
      ctx.fillRect(2, 18, 26, 4);    // right ski
      // ski tips (slightly upturned)
      ctx.beginPath();
      ctx.moveTo(-28, 18); ctx.lineTo(-32, 16); ctx.lineTo(-28, 22); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(28, 18); ctx.lineTo(32, 16); ctx.lineTo(28, 22); ctx.fill();

      // Boots / bindings
      ctx.fillStyle = '#003322';
      ctx.fillRect(-12, 12, 8, 8);
      ctx.fillRect(4, 12, 8, 8);

      // Legs (bent athletic ski stance)
      ctx.fillStyle = '#00cc7a';
      ctx.fillRect(-11, 0, 7, 14);   // left leg
      ctx.fillRect(4, 0, 7, 14);    // right leg

      // Torso / jacket (slightly crouched)
      ctx.fillStyle = '#00ff9f';
      ctx.beginPath();
      ctx.moveTo(-11, -2);
      ctx.lineTo(-13, -18);
      ctx.lineTo(13, -18);
      ctx.lineTo(11, -2);
      ctx.closePath();
      ctx.fill();
      // jacket detail line
      ctx.strokeStyle = '#003322';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -18); ctx.lineTo(0, -2);
      ctx.stroke();

      // Arms holding poles
      const poleSwing = Math.sin(yeti.frame * 0.25) * 3;
      ctx.fillStyle = '#00ff9f';
      // left arm
      ctx.save();
      ctx.translate(-12, -12);
      ctx.rotate(-0.5 + leanX + poleSwing * 0.05);
      ctx.fillRect(-3, 0, 5, 16);
      ctx.restore();
      // right arm
      ctx.save();
      ctx.translate(12, -12);
      ctx.rotate(0.5 + leanX - poleSwing * 0.05);
      ctx.fillRect(-2, 0, 5, 16);
      ctx.restore();

      // Ski poles
      ctx.strokeStyle = '#7dffc8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-18, -8 + poleSwing); ctx.lineTo(-26, 22);
      ctx.moveTo(18, -8 - poleSwing); ctx.lineTo(26, 22);
      ctx.stroke();
      // pole baskets
      ctx.beginPath();
      ctx.arc(-26, 22, 3, 0, Math.PI * 2);
      ctx.arc(26, 22, 3, 0, Math.PI * 2);
      ctx.stroke();

      // Head
      ctx.fillStyle = '#00ff9f';
      ctx.beginPath();
      ctx.arc(0, -24, 8, 0, Math.PI * 2);
      ctx.fill();

      // Helmet
      ctx.fillStyle = '#00cc7a';
      ctx.beginPath();
      ctx.arc(0, -26, 9, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(-9, -26, 18, 5);

      // Goggles
      ctx.fillStyle = '#001a12';
      ctx.fillRect(-7, -26, 14, 5);
      ctx.fillStyle = '#00ffff';
      ctx.globalAlpha = 0.7;
      ctx.fillRect(-6, -25, 5, 3);
      ctx.fillRect(1, -25, 5, 3);
      ctx.globalAlpha = 1;

      // Small determined mouth
      ctx.strokeStyle = '#003322';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-3, -18);
      ctx.lineTo(3, -18);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.restore();

      // warning banner
      if (yeti.warning > 0) {
        ctx.fillStyle = `rgba(255, 180, 50, ${0.3 + Math.sin(yeti.frame * 0.35) * 0.2})`;
        ctx.fillRect(0, 0, 480, 52);
        ctx.fillStyle = '#ffcc44';
        ctx.font = 'bold 17px Courier New';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ffaa00';
        ctx.shadowBlur = 10;
        ctx.fillText('⚠ HUNGRY YETI INCOMING ⚠', 240, 34);
        ctx.shadowBlur = 0;
      }

      // yeti — funny, desperate, sick-looking fluffy goof
      if (yeti.yetiActive) {
        const yx = yeti.yeti.x, yy = yeti.yeti.y;
        const pant = Math.sin(yeti.frame * 0.25) * 2;
        ctx.save();
        ctx.translate(yx, yy);
        ctx.shadowColor = '#aaddff';
        ctx.shadowBlur = 14;

        // shaggy white/gray body
        ctx.fillStyle = '#d8e8f0';
        ctx.beginPath();
        ctx.ellipse(0, 10 + pant * 0.3, 30, 28, 0, 0, Math.PI * 2);
        ctx.fill();
        // belly
        ctx.fillStyle = '#eef6fa';
        ctx.beginPath();
        ctx.ellipse(0, 14, 18, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        // head (big & soft)
        ctx.fillStyle = '#d8e8f0';
        ctx.beginPath();
        ctx.ellipse(0, -24 + pant, 22, 20, 0, 0, Math.PI * 2);
        ctx.fill();

        // floppy arms reaching
        ctx.fillStyle = '#c8d8e0';
        ctx.beginPath();
        ctx.ellipse(-32, 0 + pant, 12, 22, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(32, 0 - pant, 12, 22, 0.4, 0, Math.PI * 2);
        ctx.fill();

        // desperate googly eyes (uneven)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-9, -26 + pant, 7, 0, Math.PI * 2);
        ctx.arc(10, -25 + pant, 8, 0, Math.PI * 2);
        ctx.fill();
        // pupils looking slightly different directions (crazy)
        ctx.fillStyle = '#223';
        ctx.beginPath();
        ctx.arc(-7, -24 + pant, 3, 0, Math.PI * 2);
        ctx.arc(12, -27 + pant, 3.5, 0, Math.PI * 2);
        ctx.fill();
        // tired bags under eyes
        ctx.strokeStyle = '#99aab5';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(-9, -20 + pant, 5, 0.2, Math.PI - 0.2);
        ctx.stroke();

        // open panting mouth + tongue
        ctx.fillStyle = '#4a3030';
        ctx.beginPath();
        ctx.ellipse(0, -14 + pant, 8, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        // tongue hanging out
        ctx.fillStyle = '#ff6b8a';
        ctx.beginPath();
        ctx.ellipse(3, -10 + pant, 4, 5, 0.3, 0, Math.PI * 2);
        ctx.fill();

        // messy hair tufts (not horns)
        ctx.fillStyle = '#b0c4d0';
        ctx.beginPath();
        ctx.ellipse(-12, -40 + pant, 6, 8, -0.3, 0, Math.PI * 2);
        ctx.ellipse(0, -44 + pant, 7, 9, 0, 0, Math.PI * 2);
        ctx.ellipse(12, -40 + pant, 6, 8, 0.3, 0, Math.PI * 2);
        ctx.fill();

        // sweat / desperation drops
        ctx.fillStyle = '#7ec8e3';
        ctx.beginPath();
        ctx.ellipse(-20, -30 + pant, 2, 3, 0, 0, Math.PI * 2);
        ctx.ellipse(22, -28 + pant, 2.5, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.restore();
      }

      // HI score
      const hs = getHigh('yeti');
      if (hs > 0) {
        ctx.fillStyle = '#7dffc8';
        ctx.font = '11px Courier New';
        ctx.textAlign = 'left';
        ctx.fillText(`HI ${hs}`, 12, 22);
      }
    }

    // ========== 8. SPACE ROCK SWARM ==========
    let rocks = {};
    function initRocks() {
      rocks = { score:0, lives:3, ship:{x:240,y:180,angle:0,vx:0,vy:0}, bullets:[], asteroids:[], lastShot:0, invuln:0 };
      for (let i=0;i<5;i++) spawnAsteroid(3);
      updateUI(0,3); loopRocks();
    }
    function spawnAsteroid(size, x, y) {
      const speed = 0.6 + Math.random()*1.4;
      const angle = Math.random()*Math.PI*2;
      rocks.asteroids.push({
        x: x!==undefined?x:Math.random()*480, y: y!==undefined?y:Math.random()*360,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, size, r: size*14
      });
    }
    function loopRocks() {
      if (currentGame !== 'rocks') return;
      const r = rocks;
      const left = keys['ArrowLeft']||keys['a']||keys['A']||touchState.left;
      const right = keys['ArrowRight']||keys['d']||keys['D']||touchState.right;
      const thrust = keys['ArrowUp']||keys['w']||keys['W']||touchState.up;
      const fire = keys[' ']||touchState.fire;
      if (left) r.ship.angle -= 0.085; if (right) r.ship.angle += 0.085;
      if (thrust) { r.ship.vx += Math.cos(r.ship.angle)*0.18; r.ship.vy += Math.sin(r.ship.angle)*0.18; }
      r.ship.vx *= 0.985; r.ship.vy *= 0.985;
      r.ship.x += r.ship.vx; r.ship.y += r.ship.vy;
      if (r.ship.x < 0) r.ship.x = 480; if (r.ship.x > 480) r.ship.x = 0;
      if (r.ship.y < 0) r.ship.y = 360; if (r.ship.y > 360) r.ship.y = 0;
      if (fire && Date.now()-r.lastShot > 200) {
        r.bullets.push({
          x: r.ship.x + Math.cos(r.ship.angle)*14, y: r.ship.y + Math.sin(r.ship.angle)*14,
          vx: Math.cos(r.ship.angle)*7.5 + r.ship.vx, vy: Math.sin(r.ship.angle)*7.5 + r.ship.vy, life:50
        });
        r.lastShot = Date.now();
        sfx('shoot');
      }
      for (let i=r.bullets.length-1;i>=0;i--) {
        const b = r.bullets[i]; b.x+=b.vx; b.y+=b.vy; b.life--;
        if (b.life<=0 || b.x<-20||b.x>500||b.y<-20||b.y>380) r.bullets.splice(i,1);
      }
      r.asteroids.forEach(a => {
        a.x+=a.vx; a.y+=a.vy;
        if (a.x < -a.r) a.x=480+a.r; if (a.x>480+a.r) a.x=-a.r;
        if (a.y < -a.r) a.y=360+a.r; if (a.y>360+a.r) a.y=-a.r;
      });
      for (let bi=r.bullets.length-1;bi>=0;bi--) {
        const b = r.bullets[bi];
        for (let ai=r.asteroids.length-1;ai>=0;ai--) {
          const a = r.asteroids[ai];
          const dx=b.x-a.x, dy=b.y-a.y;
          if (dx*dx+dy*dy < a.r*a.r) {
            r.bullets.splice(bi,1); r.score += (4-a.size)*20; updateUI(r.score, r.lives); sfx('explode');
            if (a.size >= 2) shake(4 + a.size);
            if (a.size > 1) { spawnAsteroid(a.size-1, a.x, a.y); spawnAsteroid(a.size-1, a.x, a.y); }
            r.asteroids.splice(ai,1); break;
          }
        }
      }
      if (r.invuln > 0) r.invuln--;
      else {
        for (const a of r.asteroids) {
          const dx=r.ship.x-a.x, dy=r.ship.y-a.y;
          if (dx*dx+dy*dy < (a.r+8)*(a.r+8)) {
            r.lives--; updateUI(r.score, r.lives);
            if (r.lives <= 0) { drawRocks(); shake(12); showGameOver('SHIP DESTROYED', 'rocks', r.score); return; }
            r.ship.x=240; r.ship.y=180; r.ship.vx=0; r.ship.vy=0; r.invuln=90; break;
          }
        }
      }
      if (r.asteroids.length === 0) for (let i=0;i<5+Math.floor(r.score/400);i++) spawnAsteroid(3);
      drawRocks(); animId = requestAnimationFrame(loopRocks);
    }
    function drawRocks() {
      ctx.fillStyle='#000'; ctx.fillRect(0,0,480,360);
      rocks.asteroids.forEach(a => {
        ctx.strokeStyle='#00ff9f'; ctx.lineWidth=2; ctx.beginPath();
        const pts = 7 + a.size;
        for (let i=0;i<pts;i++) {
          const ang = (i/pts)*Math.PI*2;
          const rad = a.r * (0.75 + Math.sin(i*2.3)*0.25);
          const px = a.x + Math.cos(ang)*rad, py = a.y + Math.sin(ang)*rad;
          if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.stroke();
      });
      ctx.fillStyle='#fff';
      rocks.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x,b.y,2.5,0,Math.PI*2); ctx.fill(); });
      if (rocks.invuln===0 || Math.floor(rocks.invuln/4)%2===0) {
        ctx.save(); ctx.translate(rocks.ship.x, rocks.ship.y); ctx.rotate(rocks.ship.angle);
        ctx.strokeStyle='#00ff9f'; ctx.lineWidth=2; ctx.shadowColor='#00ff9f'; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-10,-9); ctx.lineTo(-6,0); ctx.lineTo(-10,9); ctx.closePath(); ctx.stroke();
        ctx.shadowBlur=0; ctx.restore();
      }
    }

    // ========== 9. CIRCUIT RUNNER ==========
    let runner = {};

    function initRunner() {
      runner = {
        score: 0,
        speed: 4.2,
        maxSpeed: 13,
        player: { x: 90, y: 260, w: 28, h: 36, vy: 0, onGround: true, jumpPower: -11.5 },
        gravity: 0.55,
        obstacles: [],
        coins: [],
        particles: [],
        groundY: 300,
        frame: 0,
        distance: 0,
        gameOver: false,
        invuln: 0,
        nextObstacle: 90,
        nextCoin: 50,
        bgOffset: 0,
        buildings: [],
        dashTimer: 0,
        dashCooldown: 0,
        combo: 0,
        comboTimer: 0,
        nearMissCooldown: 0,
        scorePops: []
      };
      // seed parallax buildings
      for (let i = 0; i < 8; i++) {
        runner.buildings.push({
          x: i * 140 + Math.random() * 40,
          w: 50 + Math.random() * 70,
          h: 60 + Math.random() * 140,
          layer: Math.random() > 0.5 ? 1 : 2
        });
      }
      updateUI(0, null);
      loopRunner();
    }

    function spawnRunnerObstacle() {
      const types = ['block', 'spike', 'gap'];
      const type = types[Math.floor(Math.random() * types.length)];
      if (type === 'gap') {
        runner.obstacles.push({ type: 'gap', x: 520, w: 70 + Math.random() * 50 });
      } else if (type === 'spike') {
        runner.obstacles.push({ type: 'spike', x: 520, w: 24, h: 28 });
      } else {
        const h = 30 + Math.random() * 50;
        runner.obstacles.push({ type: 'block', x: 520, w: 30 + Math.random() * 30, h });
      }
    }

    function spawnRunnerCoin() {
      runner.coins.push({
        x: 520,
        y: 160 + Math.random() * 100,
        r: 8,
        collected: false
      });
    }

    function addParticles(x, y, count, color) {
      for (let i = 0; i < count; i++) {
        runner.particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 2,
          life: 20 + Math.random() * 15,
          color
        });
      }
    }

    function loopRunner() {
      if (currentGame !== 'runner') return;
      if (runner.gameOver) return;

      const r = runner;
      r.frame++;
      // Gentler early ramp, then accelerates — feels more progressive
      const ramp = r.distance < 800 ? 0.0012 : (r.distance < 2000 ? 0.0021 : 0.0028);
      r.speed = Math.min(r.maxSpeed, r.speed + ramp);
      r.distance += r.speed;
      r.score = Math.floor(r.distance / 6) + (r.combo > 1 ? r.combo * 2 : 0);
      r.bgOffset += r.speed * 0.3;
      if (r.frame % 6 === 0) updateUI(r.score, null);

      // input
      const jumpPressed = keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' '] || touchState.up;
      const dashPressed = keys['Shift'] || keys['f'] || keys['F'] || touchState.fire;

      if (jumpPressed && r.player.onGround) {
        r.player.vy = r.player.jumpPower;
        r.player.onGround = false;
        sfx('jump');
      }

      // dash boost
      if (dashPressed && r.dashCooldown <= 0) {
        r.dashTimer = 12;
        r.dashCooldown = 45;
        r.speed = Math.min(r.maxSpeed + 3, r.speed + 2.8);
        sfx('thrust');
        addParticles(r.player.x, r.player.y + r.player.h / 2, 8, '#00ff9f');
      }
      if (r.dashCooldown > 0) r.dashCooldown--;
      if (r.dashTimer > 0) {
        r.dashTimer--;
        r.speed = Math.min(r.maxSpeed + 2, r.speed + 0.15);
      }

      // physics
      r.player.vy += r.gravity;
      r.player.y += r.player.vy;

      if (r.player.y + r.player.h >= r.groundY) {
        r.player.y = r.groundY - r.player.h;
        r.player.vy = 0;
        if (!r.player.onGround) sfx('land');
        r.player.onGround = true;
      }

      // spawn
      r.nextObstacle--;
      if (r.nextObstacle <= 0) {
        spawnRunnerObstacle();
        r.nextObstacle = 70 + Math.random() * 80 - r.speed * 2;
      }
      r.nextCoin--;
      if (r.nextCoin <= 0) {
        spawnRunnerCoin();
        r.nextCoin = 40 + Math.random() * 50;
      }

      // combo timer decay
      if (r.comboTimer > 0) r.comboTimer--;
      else r.combo = 0;
      if (r.nearMissCooldown > 0) r.nearMissCooldown--;

      // move obstacles
      for (let i = r.obstacles.length - 1; i >= 0; i--) {
        const o = r.obstacles[i];
        o.x -= r.speed;
        if (o.x + (o.w || 40) < -20) {
          r.obstacles.splice(i, 1);
          continue;
        }
        const px = r.player.x, py = r.player.y, pw = r.player.w, ph = r.player.h;

        // near-miss bonus
        if (!o.nearDone && r.nearMissCooldown <= 0 && o.type !== 'gap') {
          const oh = o.h || 28;
          const closeX = px + pw > o.x - 18 && px < o.x + o.w + 18;
          const closeY = py + ph > r.groundY - oh - 20 && py < r.groundY;
          const notHit = !(px + pw > o.x && px < o.x + o.w && py + ph > r.groundY - oh && py < r.groundY);
          if (closeX && closeY && notHit && o.x < px + pw) {
            o.nearDone = true;
            r.nearMissCooldown = 20;
            r.combo = Math.min(9, r.combo + 1);
            r.comboTimer = 90;
            const bonus = 15 * Math.max(1, r.combo);
            r.score += bonus;
            updateUI(r.score, null);
            r.scorePops.push({ x: px + pw, y: py, text: `NEAR +${bonus}`, life: 40 });
            sfx('score');
            flash(0.25);
          }
        }

        // collision
        if (r.invuln > 0) continue;
        if (o.type === 'gap') {
          if (px + pw > o.x + 10 && px < o.x + o.w - 10 && r.player.onGround) {
            r.gameOver = true;
            sfx('die');
            shake(12);
            addParticles(px + pw/2, py + ph, 12, '#ff4d8d');
            drawRunner();
            showGameOver('CIRCUIT BROKEN', 'runner', r.score);
            return;
          }
        } else {
          const oh = o.h || 28;
          if (px + pw > o.x && px < o.x + o.w && py + ph > r.groundY - oh && py < r.groundY) {
            r.gameOver = true;
            sfx('hit');
            sfx('die');
            shake(12);
            addParticles(px + pw/2, py + ph/2, 14, '#ff4d8d');
            drawRunner();
            showGameOver('SYSTEM CRASH', 'runner', r.score);
            return;
          }
        }
      }

      // coins
      for (let i = r.coins.length - 1; i >= 0; i--) {
        const c = r.coins[i];
        c.x -= r.speed;
        if (c.x < -20) { r.coins.splice(i, 1); continue; }
        const dx = (r.player.x + r.player.w/2) - c.x;
        const dy = (r.player.y + r.player.h/2) - c.y;
        if (dx*dx + dy*dy < (c.r + 16)*(c.r + 16)) {
          r.coins.splice(i, 1);
          r.combo = Math.min(9, r.combo + 1);
          r.comboTimer = 90;
          const pts = 25 * Math.max(1, r.combo);
          r.score += pts;
          updateUI(r.score, null);
          r.scorePops.push({ x: c.x, y: c.y, text: `+${pts}`, life: 35 });
          sfx('coin');
          if (r.combo >= 3) flash(0.2);
          addParticles(c.x, c.y, 6, '#ffff66');
        }
      }

      // particles
      for (let i = r.particles.length - 1; i >= 0; i--) {
        const p = r.particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
        if (p.life <= 0) r.particles.splice(i, 1);
      }

      // buildings scroll
      r.buildings.forEach(b => {
        b.x -= r.speed * (b.layer === 1 ? 0.25 : 0.45);
        if (b.x + b.w < 0) {
          b.x = 480 + Math.random() * 100;
          b.h = 60 + Math.random() * 140;
          b.w = 50 + Math.random() * 70;
        }
      });

      if (r.invuln > 0) r.invuln--;

      drawRunner();
      animId = requestAnimationFrame(loopRunner);
    }

    function drawRunner() {
      const r = runner;

      // sky
      const grad = ctx.createLinearGradient(0, 0, 0, 360);
      grad.addColorStop(0, '#050515');
      grad.addColorStop(0.5, '#0a1a2a');
      grad.addColorStop(1, '#001a12');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 480, 360);

      // stars / grid dots
      ctx.fillStyle = '#00ff9f22';
      for (let i = 0; i < 30; i++) {
        const sx = ((i * 97 + r.bgOffset * 0.2) % 500);
        const sy = (i * 53) % 200;
        ctx.fillRect(sx, sy, 2, 2);
      }

      // parallax buildings
      r.buildings.forEach(b => {
        const alpha = b.layer === 1 ? 0.15 : 0.3;
        ctx.fillStyle = `rgba(0, 255, 159, ${alpha})`;
        ctx.fillRect(b.x, r.groundY - b.h, b.w, b.h);
        // windows
        ctx.fillStyle = `rgba(0, 255, 200, ${alpha + 0.2})`;
        for (let wy = 10; wy < b.h - 10; wy += 18) {
          for (let wx = 8; wx < b.w - 8; wx += 14) {
            if (Math.random() > 0.4) ctx.fillRect(b.x + wx, r.groundY - b.h + wy, 5, 5);
          }
        }
      });

      // ground
      ctx.fillStyle = '#003322';
      ctx.fillRect(0, r.groundY, 480, 360 - r.groundY);
      // ground grid lines
      ctx.strokeStyle = '#00ff9f44';
      ctx.lineWidth = 1;
      const gridOff = (r.bgOffset * 1.5) % 40;
      for (let gx = -40; gx < 520; gx += 40) {
        ctx.beginPath();
        ctx.moveTo(gx + gridOff, r.groundY);
        ctx.lineTo(gx + gridOff - 20, 360);
        ctx.stroke();
      }
      ctx.strokeStyle = '#00ff9f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, r.groundY);
      ctx.lineTo(480, r.groundY);
      ctx.stroke();

      // obstacles
      r.obstacles.forEach(o => {
        if (o.type === 'gap') {
          ctx.fillStyle = '#000';
          ctx.fillRect(o.x, r.groundY, o.w, 60);
          ctx.strokeStyle = '#ff4d8d';
          ctx.lineWidth = 2;
          ctx.strokeRect(o.x, r.groundY, o.w, 4);
        } else if (o.type === 'spike') {
          ctx.fillStyle = '#ff4d8d';
          ctx.shadowColor = '#ff4d8d';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(o.x, r.groundY);
          ctx.lineTo(o.x + o.w / 2, r.groundY - o.h);
          ctx.lineTo(o.x + o.w, r.groundY);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = '#00ff9f';
          ctx.shadowColor = '#00ff9f';
          ctx.shadowBlur = 10;
          ctx.fillRect(o.x, r.groundY - o.h, o.w, o.h);
          ctx.shadowBlur = 0;
          // circuit detail
          ctx.strokeStyle = '#003322';
          ctx.lineWidth = 2;
          ctx.strokeRect(o.x + 4, r.groundY - o.h + 4, o.w - 8, o.h - 8);
        }
      });

      // coins
      r.coins.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffff66';
        ctx.shadowColor = '#ffff66';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        ctx.font = '10px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('$', c.x, c.y + 3);
      });

      // particles
      r.particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 30);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1;

      // speed lines
      if (r.speed > 5) {
        ctx.strokeStyle = `rgba(0, 255, 159, ${0.08 + r.speed * 0.015})`;
        ctx.lineWidth = 1;
        for (let i = 0; i < 8; i++) {
          const ly = 40 + i * 35 + (r.frame * 2 + i * 17) % 30;
          const lx = 200 + Math.sin(i * 1.7) * 80;
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.lineTo(lx - 30 - r.speed * 2, ly);
          ctx.stroke();
        }
      }

      // player
      const p = r.player;
      ctx.save();
      if (r.invuln > 0 && Math.floor(r.frame / 3) % 2 === 0) ctx.globalAlpha = 0.4;

      // dash glow
      if (r.dashTimer > 0) {
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 22;
      }

      // body
      ctx.fillStyle = '#00ff9f';
      ctx.shadowColor = '#00ff9f';
      ctx.shadowBlur = 14;
      // rounded-ish body
      ctx.fillRect(p.x, p.y + 4, p.w, p.h - 4);
      ctx.fillRect(p.x + 3, p.y, p.w - 6, 8);

      // visor
      ctx.fillStyle = '#001a12';
      ctx.fillRect(p.x + 5, p.y + 7, p.w - 10, 9);
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(p.x + 7, p.y + 9, p.w - 14, 3);

      // legs / boots
      ctx.fillStyle = '#00cc7a';
      ctx.fillRect(p.x + 4, p.y + p.h - 6, 8, 6);
      ctx.fillRect(p.x + p.w - 12, p.y + p.h - 6, 8, 6);

      // arm detail
      ctx.fillStyle = '#00ff9f';
      ctx.fillRect(p.x - 3, p.y + 14, 5, 12);
      ctx.fillRect(p.x + p.w - 2, p.y + 14, 5, 12);

      // trail / afterimage
      if (!p.onGround || r.speed > 6 || r.dashTimer > 0) {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#00ff9f';
        ctx.fillRect(p.x - 14, p.y + 8, 12, 14);
        ctx.globalAlpha = 0.18;
        ctx.fillRect(p.x - 26, p.y + 12, 10, 10);
      }
      ctx.shadowBlur = 0;
      ctx.restore();

      // score pops
      for (let i = r.scorePops.length - 1; i >= 0; i--) {
        const sp = r.scorePops[i];
        sp.y -= 0.8;
        sp.life--;
        ctx.globalAlpha = Math.max(0, sp.life / 40);
        ctx.fillStyle = '#ffff66';
        ctx.font = 'bold 13px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(sp.text, sp.x, sp.y);
        if (sp.life <= 0) r.scorePops.splice(i, 1);
      }
      ctx.globalAlpha = 1;

      // combo meter
      if (r.combo > 1) {
        ctx.fillStyle = '#ffff66';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'right';
        ctx.fillText(`COMBO x${r.combo}`, 468, 24);
      }

      // high score + speed
      ctx.fillStyle = '#00ff9f';
      ctx.font = '11px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText(`SPD ${Math.floor(r.speed * 12)}`, 12, 22);
      const hs = getHigh('runner');
      if (hs > 0) {
        ctx.fillStyle = '#7dffc8';
        ctx.fillText(`HI ${hs}`, 12, 38);
      }

      // screen flash
      if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(0, 255, 200, ${flashAlpha})`;
        ctx.fillRect(0, 0, 480, 360);
        flashAlpha *= 0.85;
        if (flashAlpha < 0.02) flashAlpha = 0;
      }
    }

    // ========== 10. NEON CLAW ==========
    let claw = {};

    function initClaw() {
      claw = {
        score: 0,
        lives: 5,           // number of drops remaining
        clawX: 240,
        clawY: 50,
        clawOpen: true,
        state: 'ready',     // ready | dropping | rising | grab
        dropSpeed: 0,
        prizes: [],
        particles: [],
        frame: 0,
        grabTarget: null,
        message: '',
        messageTimer: 0
      };
      spawnClawPrizes();
      updateUI(0, 5);
      loopClaw();
    }

    function spawnClawPrizes() {
      claw.prizes = [];
      const types = [
        { label: '$', color: '#ffff66', points: 50, r: 14 },
        { label: 'T', color: '#00ff9f', points: 30, r: 12 },
        { label: '★', color: '#ff66cc', points: 80, r: 13 },
        { label: '●', color: '#66ccff', points: 20, r: 11 },
        { label: '◆', color: '#ffaa44', points: 40, r: 12 }
      ];
      for (let i = 0; i < 9; i++) {
        const t = types[Math.floor(Math.random() * types.length)];
        claw.prizes.push({
          x: 55 + (i % 5) * 85 + (Math.random() - 0.5) * 20,
          y: 240 + Math.floor(i / 5) * 55 + (Math.random() - 0.5) * 15,
          r: t.r,
          label: t.label,
          color: t.color,
          points: t.points,
          grabbed: false,
          vx: 0,
          vy: 0
        });
      }
    }

    function loopClaw() {
      if (currentGame !== 'claw') return;
      const c = claw;
      c.frame++;

      const left  = keys['ArrowLeft'] || keys['a'] || keys['A'] || touchState.left;
      const right = keys['ArrowRight'] || keys['d'] || keys['D'] || touchState.right;
      const drop  = keys[' '] || keys['ArrowDown'] || touchState.fire;

      if (c.state === 'ready') {
        if (left)  c.clawX -= 4.2;
        if (right) c.clawX += 4.2;
        c.clawX = Math.max(40, Math.min(440, c.clawX));

        if (drop) {
          c.state = 'dropping';
          c.dropSpeed = 3.5;
          c.clawOpen = true;
          sfx('drop');
        }
      } else if (c.state === 'dropping') {
        c.clawY += c.dropSpeed;
        c.dropSpeed = Math.min(9, c.dropSpeed + 0.18);

        // Check grab near bottom
        if (c.clawY > 290) {
          c.state = 'grab';
          c.clawOpen = false;
          // Find closest prize under claw
          let best = null;
          let bestDist = 999;
          c.prizes.forEach(p => {
            if (p.grabbed) return;
            const dx = p.x - c.clawX;
            const dy = p.y - (c.clawY + 28);
            const dist = Math.hypot(dx, dy);
            if (dist < bestDist && dist < 28) {
              bestDist = dist;
              best = p;
            }
          });
          if (best && Math.random() > 0.28) {  // 72% success chance when close
            best.grabbed = true;
            c.grabTarget = best;
            c.score += best.points;
            updateUI(c.score, c.lives);
            sfx('grab');
            c.message = `+${best.points} TICKETS`;
            c.messageTimer = 50;
            // particles
            for (let i = 0; i < 10; i++) {
              c.particles.push({
                x: best.x, y: best.y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5 - 2,
                life: 30 + Math.random() * 20,
                color: best.color
              });
            }
          } else {
            sfx('miss');
            c.message = 'MISSED';
            c.messageTimer = 35;
            c.grabTarget = null;
          }
        }
      } else if (c.state === 'grab' || c.state === 'rising') {
        c.state = 'rising';
        c.clawY -= 5.5;
        if (c.grabTarget) {
          c.grabTarget.x = c.clawX;
          c.grabTarget.y = c.clawY + 30;
        }
        if (c.clawY <= 50) {
          c.clawY = 50;
          c.clawOpen = true;
          if (c.grabTarget) {
            // Remove prize
            c.prizes = c.prizes.filter(p => p !== c.grabTarget);
            c.grabTarget = null;
          }
          c.lives--;
          updateUI(c.score, c.lives);
          if (c.lives <= 0) {
            drawClaw();
            shake(8);
            showGameOver(c.score >= 150 ? 'TICKET JACKPOT' : 'CLAW EMPTY', 'claw', c.score);
            return;
          }
          // Respawn prizes if few left
          if (c.prizes.filter(p => !p.grabbed).length < 4) {
            spawnClawPrizes();
          }
          c.state = 'ready';
        }
      }

      // particles
      for (let i = c.particles.length - 1; i >= 0; i--) {
        const p = c.particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
        if (p.life <= 0) c.particles.splice(i, 1);
      }
      if (c.messageTimer > 0) c.messageTimer--;

      drawClaw();
      animId = requestAnimationFrame(loopClaw);
    }

    function drawClaw() {
      const c = claw;
      // background
      const g = ctx.createLinearGradient(0, 0, 0, 360);
      g.addColorStop(0, '#050515');
      g.addColorStop(0.6, '#0a1a18');
      g.addColorStop(1, '#001a12');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 480, 360);

      // glass cabinet frame
      ctx.strokeStyle = '#00ff9f66';
      ctx.lineWidth = 4;
      ctx.strokeRect(20, 20, 440, 320);
      ctx.strokeStyle = '#00ff9f33';
      ctx.lineWidth = 1;
      ctx.strokeRect(28, 28, 424, 304);

      // floor / prize area
      ctx.fillStyle = '#003322';
      ctx.fillRect(40, 310, 400, 30);
      ctx.strokeStyle = '#00ff9f44';
      ctx.beginPath();
      ctx.moveTo(40, 310);
      ctx.lineTo(440, 310);
      ctx.stroke();

      // prizes
      c.prizes.forEach(p => {
        if (p.grabbed && p !== c.grabTarget) return;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.label, p.x, p.y + 1);
      });

      // claw cable
      ctx.strokeStyle = '#00ff9faa';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(c.clawX, 30);
      ctx.lineTo(c.clawX, c.clawY);
      ctx.stroke();

      // claw mechanism
      ctx.fillStyle = '#00ff9f';
      ctx.shadowColor = '#00ff9f';
      ctx.shadowBlur = 10;
      // top block
      ctx.fillRect(c.clawX - 14, c.clawY - 8, 28, 14);
      // arms
      if (c.clawOpen) {
        // open
        ctx.beginPath();
        ctx.moveTo(c.clawX - 10, c.clawY + 6);
        ctx.lineTo(c.clawX - 22, c.clawY + 28);
        ctx.lineTo(c.clawX - 8, c.clawY + 24);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(c.clawX + 10, c.clawY + 6);
        ctx.lineTo(c.clawX + 22, c.clawY + 28);
        ctx.lineTo(c.clawX + 8, c.clawY + 24);
        ctx.closePath();
        ctx.fill();
      } else {
        // closed
        ctx.beginPath();
        ctx.moveTo(c.clawX - 8, c.clawY + 6);
        ctx.lineTo(c.clawX - 6, c.clawY + 26);
        ctx.lineTo(c.clawX + 6, c.clawY + 26);
        ctx.lineTo(c.clawX + 8, c.clawY + 6);
        ctx.closePath();
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // particles
      c.particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1;

      // message
      if (c.messageTimer > 0) {
        ctx.fillStyle = c.message.startsWith('+') ? '#ffff66' : '#ff6b8a';
        ctx.font = 'bold 18px Courier New';
        ctx.textAlign = 'center';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 10;
        ctx.fillText(c.message, 240, 100);
        ctx.shadowBlur = 0;
      }

      // UI
      ctx.fillStyle = '#00ff9f';
      ctx.font = '12px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText(`DROPS ${c.lives}`, 36, 48);
      const hs = getHigh('claw');
      if (hs > 0) {
        ctx.fillStyle = '#7dffc8';
        ctx.fillText(`HI ${hs}`, 36, 66);
      }
      ctx.fillStyle = '#7dffc8';
      ctx.textAlign = 'right';
      ctx.font = '11px Courier New';
      ctx.fillText('TICKETS FOR CHARITY', 444, 48);
    }
  </script>
